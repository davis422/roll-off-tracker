<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Treble Clef Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
    color: #e2e8f0;
    overflow-x: hidden;
    user-select: none;
  }

  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* ---------- HEADER ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo {
    font-size: 1.15rem;
    font-weight: 900;
    color: #22c55e;
    letter-spacing: 0.3px;
  }
  .logo span { color: #e2e8f0; font-weight: 700; }
  .stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .stat {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 0.75rem;
    font-weight: 700;
    text-align: center;
    min-width: 68px;
  }
  .stat b { display: block; font-size: 1rem; color: #22c55e; margin-top: 2px; }
  .stat.wrong b { color: #ef4444; }
  .stat.streak b { color: #fbbf24; }

  /* ---------- STAFF CARD ---------- */
  .card {
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    border-radius: 20px;
    padding: 18px 12px 10px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.6);
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(34,197,94,0.08), transparent 60%);
    pointer-events: none;
  }
  svg.staff {
    width: 100%;
    height: auto;
    display: block;
    touch-action: manipulation;
  }

  /* ---------- FEEDBACK ---------- */
  .feedback {
    text-align: center;
    font-size: 1rem;
    font-weight: 800;
    min-height: 26px;
    transition: color 0.15s;
  }
  .feedback.correct { color: #22c55e; }
  .feedback.wrong { color: #ef4444; }
  .feedback.idle { color: #64748b; }

  /* ---------- PIANO ---------- */
  .piano-wrap {
    background: #0b1220;
    border-radius: 16px;
    padding: 12px 10px 16px;
    box-shadow: inset 0 0 0 1px #1e293b, 0 12px 24px rgba(0,0,0,0.4);
  }
  .piano {
    position: relative;
    display: flex;
    justify-content: center;
    height: 130px;
  }
  .key {
    position: relative;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.05s, background 0.1s;
  }
  .key:active { transform: translateY(2px); }

  .white {
    width: 44px;
    height: 100%;
    background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
    border-radius: 0 0 6px 6px;
    box-shadow: inset -1px 0 0 #cbd5e1, inset 0 -4px 0 #cbd5e1, 0 3px 0 #94a3b8;
    color: #0f172a;
    font-weight: 800;
    font-size: 0.7rem;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
  }
  .white:hover { background: linear-gradient(180deg, #f8fafc 0%, #dbeafe 100%); }
  .white.correct { background: linear-gradient(180deg, #86efac 0%, #22c55e 100%) !important; color: #052e16; }
  .white.wrong { background: linear-gradient(180deg, #fca5a5 0%, #ef4444 100%) !important; color: #450a0a; }

  .black {
    width: 28px;
    height: 62%;
    background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
    border-radius: 0 0 5px 5px;
    box-shadow: inset -1px 0 0 #000, 0 3px 0 #000;
    color: #94a3b8;
    font-weight: 800;
    font-size: 0.6rem;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
    z-index: 3;
    margin-left: -14px;
    margin-right: -14px;
  }
  .black:hover { background: linear-gradient(180deg, #475569 0%, #1e293b 100%); }
  .black.correct { background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%) !important; color: #052e16; }
  .black.wrong { background: linear-gradient(180deg, #f87171 0%, #dc2626 100%) !important; color: #450a0a; }

  /* ---------- CONTROLS ---------- */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    background: #1e293b;
    color: #e2e8f0;
    border: 1px solid #334155;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: #334155; border-color: #475569; }
  .btn.primary { background: #16a34a; border-color: #16a34a; color: white; }
  .btn.primary:hover { background: #15803d; border-color: #15803d; }
  .btn.warn { background: #b91c1c; border-color: #b91c1c; color: white; }
  .btn.warn:hover { background: #991b1b; border-color: #991b1b; }
  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    color: #94a3b8;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #1e293b;
    cursor: pointer;
  }
  .toggle input { accent-color: #22c55e; width: 16px; height: 16px; }

  /* ---------- HINT ---------- */
  .hint {
    text-align: center;
    font-size: 0.75rem;
    color: #64748b;
    line-height: 1.5;
  }
  .hint kbd {
    background: #1e293b;
    border: 1px solid #334155;
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.7rem;
    color: #e2e8f0;
    margin: 0 2px;
  }

  /* ---------- CELEBRATION ---------- */
  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    pointer-events: none;
    z-index: 9999;
    animation: fall 1.6s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
    padding: 28px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }
  .modal h2 { font-size: 1.4rem; font-weight: 900; margin-bottom: 10px; color: #22c55e; }
  .modal p { font-size: 0.9rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 8px; }
  .modal .big { font-size: 2.4rem; font-weight: 900; color: #fbbf24; margin: 12px 0; }
  .modal .btn { margin-top: 16px; width: 100%; padding: 12px; }

  @media (max-width: 600px) {
    .white { width: 38px; }
    .black { width: 24px; margin-left: -12px; margin-right: -12px; }
    .piano { height: 110px; }
    .logo { font-size: 1rem; }
    .stat { min-width: 58px; padding: 5px 9px; font-size: 0.68rem; }
  }
  @media (max-width: 420px) {
    .white { width: 34px; }
    .black { width: 22px; margin-left: -11px; margin-right: -11px; }
    .piano { height: 100px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">🎹 <span>Treble Clef Flashcards</span></div>
    <div class="stats">
      <div class="stat">SCORE <b id="statScore">0</b></div>
      <div class="stat wrong">WRONG <b id="statWrong">0</b></div>
      <div class="stat streak">STREAK <b id="statStreak">0</b></div>
      <div class="stat">BEST <b id="statBest">0</b></div>
    </div>
  </header>

  <!-- STAFF CARD -->
  <div class="card">
    <svg class="staff" viewBox="0 0 500 260" preserveAspectRatio="xMidYMid meet">
      <!-- Staff lines -->
      <g stroke="#0f172a" stroke-width="1.6" stroke-linecap="round">
        <line x1="60" y1="90"  x2="440" y2="90"  />
        <line x1="60" y1="115" x2="440" y2="115" />
        <line x1="60" y1="140" x2="440" y2="140" />
        <line x1="60" y1="165" x2="440" y2="165" />
        <line x1="60" y1="190" x2="440" y2="190" />
      </g>

      <!-- Treble clef -->
      <text x="78" y="186" font-size="140" font-family="Georgia, serif" fill="#0f172a" text-anchor="middle">𝄞</text>

      <!-- Ledger lines will be drawn here dynamically -->
      <g id="ledgerLines" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round"></g>

      <!-- The note -->
      <g id="noteGroup">
        <ellipse id="noteHead" cx="270" cy="140" rx="13" ry="9.5"
                 fill="#0f172a" transform="rotate(-20 270 140)"/>
        <line id="noteStem" x1="283" y1="140" x2="283" y2="90"
              stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
      </g>

      <!-- Accidental (sharp/flat) — hidden by default -->
      <text id="accidental" x="248" y="150" font-size="34" font-weight="700"
            fill="#0f172a" text-anchor="middle" style="display:none;">♯</text>
    </svg>
  </div>

  <div class="feedback idle" id="feedback">Tap the correct key below</div>

  <!-- PIANO -->
  <div class="piano-wrap">
    <div class="piano" id="piano"></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn primary" id="btnNext">🎲 Skip Note</button>
    <button class="btn" id="btnReveal">👀 Show Answer</button>
    <button class="btn warn" id="btnReset">↺ Reset Score</button>
    <label class="toggle">
      <input type="checkbox" id="chkRange" />
      Show only C4–C5
    </label>
  </div>

  <div class="hint">
    Keyboard shortcuts: <kbd>a</kbd> <kbd>w</kbd> <kbd>s</kbd> <kbd>e</kbd> <kbd>d</kbd> <kbd>f</kbd> <kbd>t</kbd> <kbd>g</kbd> <kbd>y</kbd> <kbd>h</kbd> <kbd>u</kbd> <kbd>j</kbd> <kbd>k</kbd> · <kbd>space</kbd> skip
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nice Work!</h2>
    <p id="modalBody">You nailed 10 in a row.</p>
    <div class="big" id="modalBig">🔥</div>
    <p id="modalSub" style="font-size:0.8rem; color:#94a3b8;"></p>
    <button class="btn primary" id="modalBtn">Keep Going</button>
  </div>
</div>

<script>
/* ============================================================
   NOTE DEFINITIONS
   Treble clef notes from C4 (middle C) up to A5.
   Each note has:
     name   — display name (e.g. "C")
     octave — the octave number
     key    — piano key id (e.g. "C4")
     y      — vertical position on the staff (viewBox units)
     sharp  — if true, draws a sharp symbol
   Middle C is at y = 215 (below the staff) with a ledger line.
   ============================================================ */
const STAFF = { top: 90, gap: 25 }; // top line y=90, each line 25 apart

// helper: get y for a diatonic step (0 = bottom line E4)
// Each step = half a staff gap (12.5 units)
function yForStep(step) {
  // step 0 => E4 (bottom line) => y=190
  return 190 - step * (STAFF.gap / 2);
}

const NOTES = [
  // name, octave, sharp, step (0 = E4 bottom line)
  { name: "C", octave: 4, sharp: false, step: -2 }, // middle C (ledger below)
  { name: "D", octave: 4, sharp: false, step: -1 },
  { name: "E", octave: 4, sharp: false, step: 0  },
  { name: "F", octave: 4, sharp: false, step: 1  },
  { name: "G", octave: 4, sharp: false, step: 2  },
  { name: "A", octave: 4, sharp: false, step: 3  },
  { name: "B", octave: 4, sharp: false, step: 4  },
  { name: "C", octave: 5, sharp: false, step: 5  },
  { name: "D", octave: 5, sharp: false, step: 6  },
  { name: "E", octave: 5, sharp: false, step: 7  },
  { name: "F", octave: 5, sharp: false, step: 8  },
  { name: "G", octave: 5, sharp: false, step: 9  },
  { name: "A", octave: 5, sharp: false, step: 10 },
];

// range to filter (C4 to C5 = steps -2 through 5)
const RANGE_LOW = { name: "C", octave: 4 };
const RANGE_HIGH = { name: "C", octave: 5 };

function inRange(note) {
  const idx = NOTES.indexOf(note);
  const lo = NOTES.findIndex(n => n.name === RANGE_LOW.name && n.octave === RANGE_LOW.octave);
  const hi = NOTES.findIndex(n => n.name === RANGE_HIGH.name && n.octave === RANGE_HIGH.octave);
  return idx >= lo && idx <= hi;
}

/* ============================================================
   PIANO KEYS
   Layout: 8 white keys (C4..C5), with black keys between.
   For simplicity we build one octave + the top C5.
   ============================================================ */
const PIANO = [
  // white keys in order
  { id: "C4",  label: "C",  type: "white", note: { name: "C", octave: 4 } },
  { id: "D4",  label: "D",  type: "white", note: { name: "D", octave: 4 } },
  { id: "E4",  label: "E",  type: "white", note: { name: "E", octave: 4 } },
  { id: "F4",  label: "F",  type: "white", note: { name: "F", octave: 4 } },
  { id: "G4",  label: "G",  type: "white", note: { name: "G", octave: 4 } },
  { id: "A4",  label: "A",  type: "white", note: { name: "A", octave: 4 } },
  { id: "B4",  label: "B",  type: "white", note: { name: "B", octave: 4 } },
  { id: "C5",  label: "C",  type: "white", note: { name: "C", octave: 5 } },
  // black keys inserted after specific whites
  { id: "C#4", label: "C♯", type: "black", after: "C4", note: { name: "C", octave: 4, sharp: true } },
  { id: "D#4", label: "D♯", type: "black", after: "D4", note: { name: "D", octave: 4, sharp: true } },
  { id: "F#4", label: "F♯", type: "black", after: "F4", note: { name: "F", octave: 4, sharp: true } },
  { id: "G#4", label: "G♯", type: "black", after: "G4", note: { name: "G", octave: 4, sharp: true } },
  { id: "A#4", label: "A♯", type: "black", after: "A4", note: { name: "A", octave: 4, sharp: true } },
];

/* ============================================================
   STATE
   ============================================================ */
let currentNote = null;
let score = 0, wrong = 0, streak = 0, best = 0;
let locked = false;         // stop accepting input after correct
let showingAnswer = false;
let rangeOnly = false;
let lastNote = null;

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const noteHead = $("noteHead");
const noteStem = $("noteStem");
const noteGroup = $("noteGroup");
const ledgerLines = $("ledgerLines");
const accidentalEl = $("accidental");
const feedbackEl = $("feedback");
const pianoEl = $("piano");
const chkRange = $("chkRange");

/* ============================================================
   PIANO RENDERING
   ============================================================ */
function buildPiano() {
  pianoEl.innerHTML = "";
  const whiteKeys = PIANO.filter(k => k.type === "white");
  const blackKeys = PIANO.filter(k => k.type === "black");

  // Create a wrapper to hold whites side by side
  whiteKeys.forEach(k => {
    const btn = document.createElement("button");
    btn.className = "key white";
    btn.dataset.id = k.id;
    btn.textContent = k.label;
    btn.addEventListener("click", () => handleAnswer(k, btn));
    pianoEl.appendChild(btn);
  });

  // Insert blacks by positioning them absolutely-ish using margins
  // We do a second pass: place them right after their "after" white key
  blackKeys.forEach(k => {
    const afterEl = pianoEl.querySelector(`[data-id="${k.after}"]`);
    if (!afterEl) return;
    const btn = document.createElement("button");
    btn.className = "key black";
    btn.dataset.id = k.id;
    btn.textContent = k.label;
    btn.addEventListener("click", () => handleAnswer(k, btn));
    afterEl.insertAdjacentElement("afterend", btn);
  });
}

/* ============================================================
   SVG NOTE RENDERING
   ============================================================ */
function renderNote(note) {
  const y = yForStep(note.step);
  const cx = 270;

  // Note head
  noteHead.setAttribute("cx", cx);
  noteHead.setAttribute("cy", y);
  noteHead.setAttribute("transform", `rotate(-20 ${cx} ${y})`);

  // Stem: up if below middle line (y > 140), down if above
  const stemUp = y > 140;
  const stemX = stemUp ? cx + 13 : cx - 13;
  const stemY1 = y;
  const stemY2 = stemUp ? y - 55 : y + 55;
  noteStem.setAttribute("x1", stemX);
  noteStem.setAttribute("y1", stemY1);
  noteStem.setAttribute("x2", stemX);
  noteStem.setAttribute("y2", stemY2);

  // Ledger lines (middle C and above/below staff)
  ledgerLines.innerHTML = "";
  const addLedger = (lineY) => {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", cx - 22);
    l.setAttribute("y1", lineY);
    l.setAttribute("x2", cx + 22);
    l.setAttribute("y2", lineY);
    ledgerLines.appendChild(l);
  };
  // Middle C at step -2 => y = 215; ledger line under it
  if (note.step === -2) addLedger(215);
  // A5 at step 10 => y = 65; ledger line above
  if (note.step === 10) addLedger(65);

  // Accidental
  if (note.sharp) {
    accidentalEl.style.display = "block";
    accidentalEl.textContent = "♯";
    accidentalEl.setAttribute("x", cx - 32);
    accidentalEl.setAttribute("y", y + 12);
  } else {
    accidentalEl.style.display = "none";
  }
}

/* ============================================================
   GAME LOGIC
   ============================================================ */
function notesPool() {
  return rangeOnly ? NOTES.filter(inRange) : NOTES;
}

function pickRandomNote() {
  const pool = notesPool();
  let note;
  do {
    note = pool[Math.floor(Math.random() * pool.length)];
  } while (pool.length > 1 && lastNote &&
           note.name === lastNote.name && note.octave === lastNote.octave);
  lastNote = note;
  return note;
}

function newRound() {
  currentNote = pickRandomNote();
  locked = false;
  showingAnswer = false;
  renderNote(currentNote);
  feedbackEl.textContent = "Tap the correct key below";
  feedbackEl.className = "feedback idle";
  clearKeyHighlights();
}

function clearKeyHighlights() {
  document.querySelectorAll(".key").forEach(k => {
    k.classList.remove("correct", "wrong");
  });
}

function handleAnswer(keyData, btnEl) {
  if (locked) return;
  const note = keyData.note;

  // Match only naturals for now (ignore sharps unless we add them)
  if (!currentNote) return;

  const isCorrect =
    note.name === currentNote.name &&
    note.octave === currentNote.octave &&
    (note.sharp || false) === (currentNote.sharp || false);

  if (isCorrect) {
    locked = true;
    score++;
    streak++;
    if (streak > best) best = streak;
    updateStats();
    btnEl.classList.add("correct");
    feedbackEl.textContent = `✅ Correct! That's ${currentNote.name}${currentNote.octave}`;
    feedbackEl.className = "feedback correct";
    playTone(currentNote);
    celebrate();
    setTimeout(() => {
      newRound();
    }, 900);
  } else {
    wrong++;
    streak = 0;
    updateStats();
    btnEl.classList.add("wrong");
    feedbackEl.textContent = `❌ Not quite — try again`;
    feedbackEl.className = "feedback wrong";
    // Remove wrong highlight after a moment
    setTimeout(() => btnEl.classList.remove("wrong"), 400);
  }
}

function updateStats() {
  $("statScore").textContent = score;
  $("statWrong").textContent = wrong;
  $("statStreak").textContent = streak;
  $("statBest").textContent = best;
}

/* ============================================================
   SOUND (simple WebAudio beep so it feels like a piano)
   ============================================================ */
let audioCtx = null;
function playTone(note) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const semitoneMap = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 1
