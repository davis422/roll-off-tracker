<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treble Clef Flash Cards</title>
<style>
  :root{--bg:#14161c;--card:#fdfaf3;--ink:#1d1d22;--accent:#4f7cff;--good:#2ecc71;--bad:#e74c3c;--muted:#8b90a0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#232838,var(--bg));color:#eef0f6;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
  h1{margin:0 0 4px;font-size:1.6rem}
  .sub{color:var(--muted);margin-bottom:16px;font-size:.95rem}
  .stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
  .stat{background:#1f2330;border-radius:12px;padding:8px 16px;text-align:center;min-width:80px}
  .stat b{display:block;font-size:1.4rem}
  .stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .card{background:var(--card);border-radius:20px;width:100%;max-width:560px;padding:10px;box-shadow:0 12px 40px #0008;transition:box-shadow .2s,transform .2s}
  .card.good{box-shadow:0 0 0 4px var(--good),0 12px 40px #0008}
  .card.bad{box-shadow:0 0 0 4px var(--bad),0 12px 40px #0008;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
  svg{width:100%;height:auto;display:block}
  .msg{height:28px;margin:10px 0;font-weight:600;font-size:1.1rem}
  .controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;align-items:center}
  .seg{display:flex;background:#1f2330;border-radius:10px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--muted);padding:9px 16px;font-size:.9rem;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .piano{position:relative;width:100%;max-width:720px;height:170px;user-select:none;touch-action:manipulation}
  .wk{position:absolute;top:0;height:100%;background:#fff;border:1px solid #333;border-radius:0 0 8px 8px;cursor:pointer;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:#aaa;font-size:.7rem;transition:background .1s}
  .wk:hover{background:#e8efff}
  .wk:active{background:#cfdcff}
  .bk{position:absolute;top:0;height:60%;background:#111;border-radius:0 0 6px 6px;z-index:2;cursor:pointer}
  .flash-good{background:var(--good)!important}
  .flash-bad{background:var(--bad)!important}
  .letters{display:none;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
  .letters button{width:64px;height:64px;font-size:1.6rem;font-weight:700;border:0;border-radius:14px;background:#2a3042;color:#fff;cursor:pointer;transition:transform .08s,background .1s}
  .letters button:hover{background:var(--accent)}
  .letters button:active{transform:scale(.93)}
  .letters button.flash-good{color:#fff}
  .hint{color:var(--muted);font-size:.8rem;margin-top:14px;text-align:center}
  .skip{background:none;border:1px solid #333a50;color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer}
  .skip:hover{color:#fff;border-color:#fff}
</style>
</head>
<body>
  <h1>🎼 Treble Clef Flash Cards</h1>
  <div class="sub">Name the note on the staff</div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>Correct</span></div>
    <div class="stat"><b id="streak">0</b><span>Streak</span></div>
    <div class="stat"><b id="best">0</b><span>Best</span></div>
    <div class="stat"><b id="acc">–</b><span>Accuracy</span></div>
  </div>

  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-mode="piano" class="on">🎹 Piano</button>
      <button data-mode="buttons">🔤 Buttons</button>
    </div>
    <label id="octaveLabel"><input type="checkbox" id="anyOctave"> Any octave counts</label>
    <label><input type="checkbox" id="sound" checked> Sound</label>
    <label><input type="checkbox" id="showNames"> Show key labels</label>
  </div>

  <div class="card" id="card">
    <svg viewBox="0 0 400 200" id="staff" aria-label="Musical staff"></svg>
  </div>
  <div class="msg" id="msg"></div>

  <div class="piano" id="piano"></div>
  <div class="letters" id="letters"></div>

  <div class="controls" style="margin-top:16px">
    <button class="skip" id="skip">Skip ⏭</button>
    <button class="skip" id="reset">Reset stats</button>
  </div>
  <div class="hint">Tip: press <b>A–G</b> on your computer keyboard to answer too.</div>

<script>
(function(){
  // ---- Note data: diatonic index 0 = C4 ... 12 = A5 ----
  var NAMES = ['C','D','E','F','G','A','B'];
  var MIN = 0, MAX = 12;                       // C4 .. A5
  function noteName(i){ return NAMES[i % 7]; }
  function octave(i){ return 4 + Math.floor(i / 7); }

  // ---- State ----
  var current = null, last = -1, locked = false;
  var s = { score:0, streak:0, best:0, tries:0 };
  try { var saved = JSON.parse(localStorage.getItem('trebleFlash')||'null'); if(saved) s = Object.assign(s, saved); } catch(e){}
  function save(){ try{ localStorage.setItem('trebleFlash', JSON.stringify(s)); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var mode = 'piano';

  // ---- Staff drawing ----
  var LINE_Y = [60,76,92,108,124]; // F5 .. E4
  var HALF = 8;
  function yFor(i){ return 124 - (i - 2) * HALF; }

  function drawStaff(i){
    var svg = $('staff'), h = '';
    LINE_Y.forEach(function(y){ h += '<line x1="20" x2="380" y1="'+y+'" y2="'+y+'" stroke="#222" stroke-width="1.6"/>'; });
    h += '<line x1="20" x2="20" y1="60" y2="124" stroke="#222" stroke-width="2"/>';
    h += '<text x="30" y="136" font-size="104" fill="#222" font-family="\'Noto Music\',\'Segoe UI Symbol\',\'Apple Symbols\',serif">\uD834\uDD1E</text>';
    if (i !== null){
      var y = yFor(i), x = 250;
      // ledger lines
      if (i <= 0) for (var l = 0; l >= i; l -= 2) h += ledger(x, yFor(l));
      if (i >= 12) for (var u = 12; u <= i; u += 2) h += ledger(x, yFor(u));
      var up = i < 6;
      h += '<g id="noteG">';
      h += up ? '<line x1="'+(x+10.5)+'" x2="'+(x+10.5)+'" y1="'+(y-1)+'" y2="'+(y-52)+'" stroke="#111" stroke-width="2.4"/>'
              : '<line x1="'+(x-10.5)+'" x2="'+(x-10.5)+'" y1="'+(y+1)+'" y2="'+(y+52)+'" stroke="#111" stroke-width="2.4"/>';
      h += '<ellipse cx="'+x+'" cy="'+y+'" rx="12" ry="8.2" fill="#111" transform="rotate(-20 '+x+' '+y+')"/>';
      h += '</g>';
    }
    svg.innerHTML = h;
  }
  function ledger(x,y){ return '<line x1="'+(x-22)+'" x2="'+(x+22)+'" y1="'+y+'" y2="'+y+'" stroke="#222" stroke-width="1.6"/>'; }

  // ---- Piano keyboard (C4 .. A5 white keys, black keys between) ----
  function buildPiano(){
    var p = $('piano'), n = MAX - MIN + 1, w = 100 / n, h = '';
    for (var i = MIN; i <= MAX; i++){
      h += '<div class="wk" data-i="'+i+'" style="left:'+((i-MIN)*w)+'%;width:'+w+'%"><span class="lbl"></span></div>';
    }
    for (var j = MIN; j < MAX; j++){
      var nm = noteName(j);
      if (nm === 'E' || nm === 'B') continue;
      h += '<div class="bk" data-black="1" style="left:'+(((j-MIN)+1)*w - w*0.3)+'%;width:'+(w*0.6)+'%"></div>';
    }
    p.innerHTML = h;
    p.addEventListener('pointerdown', function(e){
      var k = e.target.closest('.wk,.bk'); if(!k) return;
      if (k.dataset.black) return wrong(k, true);
      answer(+k.dataset.i, k);
    });
    updateLabels();
  }
  function updateLabels(){
    var on = $('showNames').checked;
    document.querySelectorAll('.wk').forEach(function(k){
      var i = +k.dataset.i;
      k.firstChild.textContent = on ? noteName(i) + octave(i) : (noteName(i)==='C' ? 'C'+octave(i) : '');
    });
  }

  // ---- Letter buttons ----
  function buildLetters(){
    var l = $('letters');
    l.innerHTML = NAMES.map(function(n){ return '<button data-n="'+n+'">'+n+'</button>'; }).join('');
    l.addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      answerLetter(b.dataset.n, b);
    });
  }

  // ---- Audio ----
  var ctx = null;
  function freq(i){ // semitone from C4 for naturals
    var semis = [0,2,4,5,7,9,11];
    var st = semis[i % 7] + 12 * Math.floor(i / 7);
    return 261.63 * Math.pow(2, st / 12);
  }
  function beep(f, dur, type, vol){
    if (!$('sound').checked) return;
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(vol || 0.25, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur);
    }catch(e){}
  }

  // ---- Game logic ----
  function next(){
    var i; do { i = MIN + Math.floor(Math.random() * (MAX - MIN + 1)); } while (i === last);
    last = current = i; locked = false;
    drawStaff(i);
    $('msg').textContent = ''; $('msg').style.color = '';
    $('card').className = 'card';
  }
  function stats(){
    $('score').textContent = s.score; $('streak').textContent = s.streak; $('best').textContent = s.best;
    $('acc').textContent = s.tries ? Math.round(100 * s.score / s.tries) + '%' : '–';
    save();
  }
  function flash(el, cls){ if(!el) return; el.classList.add(cls); setTimeout(function(){ el.classList.remove(cls); }, 450); }

  function correct(el){
    locked = true; s.score++; s.tries++; s.streak++; if (s.streak > s.best) s.best = s.streak;
    stats(); flash(el, 'flash-good');
    $('card').className = 'card good';
    $('msg').style.color = 'var(--good)';
    $('msg').textContent = '✓ ' + noteName(current) + octave(current) + '!';
    beep(freq(current), 0.6, 'triangle');
    setTimeout(next, 650);
  }
  function wrong(el, silent){
    if (locked) return;
    if (!silent){ s.tries++; s.streak = 0; stats(); }
    flash(el, 'flash-bad');
    var c = $('card'); c.className = 'card'; void c.offsetWidth; c.className = 'card bad';
    $('msg').style.color = 'var(--bad)';
    $('msg').textContent = silent ? 'Only white keys here — try again' : 'Not quite — try again';
    beep(140, 0.25, 'sawtooth', 0.12);
  }
  function answer(i, el){
    if (locked) return;
    var ok = $('anyOctave').checked ? (i % 7 === current % 7) : (i === current);
    ok ? correct(el) : wrong(el);
  }
  function answerLetter(n, el){
    if (locked) return;
    n === noteName(current) ? correct(el) : wrong(el);
  }

  // ---- UI wiring ----
  $('modeSeg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    mode = b.dataset.mode;
    document.querySelectorAll('#modeSeg button').forEach(function(x){ x.classList.toggle('on', x === b); });
    $('piano').style.display = mode === 'piano' ? '' : 'none';
    $('letters').style.display = mode === 'buttons' ? 'flex' : 'none';
    $('octaveLabel').style.display = mode === 'piano' ? '' : 'none';
  });
  $('showNames').addEventListener('change', updateLabels);
  $('skip').addEventListener('click', function(){ s.streak = 0; stats(); next(); });
  $('reset').addEventListener('click', function(){ s = {score:0,streak:0,best:0,tries:0}; stats(); });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toUpperCase();
    if (NAMES.indexOf(k) < 0) return;
    // find the matching button/key to flash
    var el = mode === 'buttons' ? document.querySelector('#letters button[data-n="'+k+'"]') : null;
    if (mode === 'piano'){
      var cands = [].slice.call(document.querySelectorAll('.wk')).filter(function(x){ return noteName(+x.dataset.i) === k; });
      el = cands.filter(function(x){ return +x.dataset.i === current; })[0] || cands[0];
    }
    answerLetter(k, el);
  });

  // ---- Init ----
  buildPiano(); buildLetters(); stats(); next();
})();
</script>
</body>
</html>
