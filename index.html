<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roll-Off Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f3f4f6; color: #111827; height: 100vh; display: flex; flex-direction: column; }
    
    /* Header & Admin Bar */
    header { background: #15803d; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 800; }
    select.role-sel { background: white; color: #111827; border: none; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }

    /* Main Toolbar */
    .toolbar { background: #ffffff; padding: 10px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; overflow-x: auto; }
    .btn { padding: 8px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #ffffff; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
    .btn-green { background: #15803d; color: white; border: none; }
    .btn-danger { background: #dc2626; color: white; border: none; }

    /* Filters Bar */
    .filter-bar { background: #f9fafb; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 700; }
    .filter-bar select { padding: 4px 8px; border-radius: 6px; border: 1px solid #d1d5db; }

    /* Box List View */
    .content { flex: 1; overflow-y: auto; padding: 10px; }
    .empty-msg { text-align: center; color: #6b7280; padding: 40px 20px; font-size: 0.9rem; }

    .box-card { background: white; border-radius: 8px; border: 1px solid #e5e7eb; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .box-header { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; font-weight: 800; margin-bottom: 6px; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge-Available { background: #e5e7eb; color: #374151; }
    .badge-Customer { background: #dcfce7; color: #15803d; }
    .badge-Pickup { background: #fef3c7; color: #d97706; }
    .badge-Exchange { background: #dbeafe; color: #2563eb; }

    .box-info { font-size: 0.82rem; color: #4b5563; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 10px; }
    .box-info div { margin-bottom: 2px; }

    .card-actions { display: flex; gap: 6px; border-top: 1px solid #f3f4f6; padding-top: 8px; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 16px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
    .modal h3 { font-size: 1.05rem; font-weight: 800; }
    .modal label { font-size: 0.75rem; font-weight: 700; color: #374151; margin-bottom: -6px; }
    .modal input, .modal select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.85rem; }
    .modal-btns { display: flex; gap: 8px; margin-top: 6px; }
    .modal-btns button { flex: 1; padding: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>🚚 ROLL-OFF TRACKER</h1>
    <select id="roleToggle" class="role-sel" onchange="switchRole(this.value)">
      <option value="Driver">Role: Driver</option>
      <option value="Admin">Role: Admin</option>
    </select>
  </header>

  <div class="toolbar">
    <button class="btn btn-green" onclick="openModal('addBoxModal')">+ Add Box</button>
    <button class="btn" onclick="openModal('addCustomerModal')">+ Add Customer</button>
    <button class="btn" onclick="openModal('addDriverModal')">+ Add Driver</button>
  </div>

  <div class="filter-bar">
    <span id="boxCount">BOXES (0)</span>
    <select id="statusFilter" onchange="renderApp()">
      <option value="ALL">All Statuses</option>
      <option value="Available">Available (Yard)</option>
      <option value="Customer">At Customer</option>
      <option value="Pickup">Ready for Pickup</option>
      <option value="Exchange">Ready for Exchange</option>
    </select>
  </div>

  <div id="contentList" class="content"></div>

  <!-- Add Box Modal -->
  <div id="addBoxModal" class="modal-overlay">
    <div class="modal">
      <h3>Add New Box</h3>
      <label>Box Number</label>
      <input type="text" id="newBoxNum" placeholder="e.g. 247 or B-12" />
      <label>Size</label>
      <select id="newBoxSize">
        <option value="10">10 Yard</option>
        <option value="20">20 Yard</option>
        <option value="30" selected>30 Yard</option>
        <option value="40">40 Yard</option>
      </select>
      <label>Customer</label>
      <select id="newBoxCustomer"><option value="Yard / Stock">Yard / Stock</option></select>
      <label>Driver</label>
      <select id="newBoxDriver"><option value="Unassigned">Unassigned</option></select>
      <label>Drop Address</label>
      <input type="text" id="newBoxAddress" placeholder="Address (Leave blank if in yard)" />
      <label>Initial Status</label>
      <select id="newBoxStatus">
        <option value="Available">Available (Yard)</option>
        <option value="Customer">At Customer</option>
        <option value="Pickup">Ready for Pickup</option>
        <option value="Exchange">Ready for Exchange</option>
      </select>
      <label>Notes</label>
      <input type="text" id="newBoxNotes" placeholder="Gate codes, waste type, etc." />
      <div class="modal-btns">
        <button class="btn btn-green" onclick="saveBox()">Save Box</button>
        <button class="btn" onclick="closeModal('addBoxModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Add Customer Modal -->
  <div id="addCustomerModal" class="modal-overlay">
    <div class="modal">
      <h3>Add Customer</h3>
      <label>Customer / Company Name</label>
      <input type="text" id="newCustName" placeholder="e.g. Acme Construction" />
      <div class="modal-btns">
        <button class="btn btn-green" onclick="saveCustomer()">Save Customer</button>
        <button class="btn" onclick="closeModal('addCustomerModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Add Driver Modal -->
  <div id="addDriverModal" class="modal-overlay">
    <div class="modal">
      <h3>Add Driver</h3>
      <label>Driver Name</label>
      <input type="text" id="newDriverName" placeholder="Driver Name" />
      <div class="modal-btns">
        <button class="btn btn-green" onclick="saveDriver()">Save Driver</button>
        <button class="btn" onclick="closeModal('addDriverModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Edit Status Modal -->
  <div id="editStatusModal" class="modal-overlay">
    <div class="modal">
      <h3>Update Box Status</h3>
      <label>Select New Status</label>
      <select id="editStatusVal">
        <option value="Available">Available (Yard)</option>
        <option value="Customer">At Customer</option>
        <option value="Pickup">Ready for Pickup</option>
        <option value="Exchange">Ready for Exchange</option>
      </select>
      <label>Update Location / Address</label>
      <input type="text" id="editAddressVal" placeholder="New address..." />
      <div class="modal-btns">
        <button class="btn btn-green" onclick="commitStatusUpdate()">Update</button>
        <button class="btn" onclick="closeModal('editStatusModal')">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // State initialization
    let db = {
      boxes: JSON.parse(localStorage.getItem('ro_boxes') || '[]'),
      customers: JSON.parse(localStorage.getItem('ro_customers') || '[]'),
      drivers: JSON.parse(localStorage.getItem('ro_drivers') || '[]')
    };
    let currentRole = 'Driver';
    let activeEditBoxId = null;

    function saveDB() {
      localStorage.setItem('ro_boxes', JSON.stringify(db.boxes));
      localStorage.setItem('ro_customers', JSON.stringify(db.customers));
      localStorage.setItem('ro_drivers', JSON.stringify(db.drivers));
    }

    function switchRole(val) { currentRole = val; renderApp(); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function updateDropdowns() {
      const cSel = document.getElementById('newBoxCustomer');
      cSel.innerHTML = '<option value="Yard / Stock">Yard / Stock</option>';
      db.customers.forEach(c => cSel.innerHTML += `<option value="${c}">${c}</option>`);

      const dSel = document.getElementById('newBoxDriver');
      dSel.innerHTML = '<option value="Unassigned">Unassigned</option>';
      db.drivers.forEach(d => dSel.innerHTML += `<option value="${d}">${d}</option>`);
    }

    function saveCustomer() {
      const name = document.getElementById('newCustName').value.trim();
      if(name) { db.customers.push(name); saveDB(); updateDropdowns(); closeModal('addCustomerModal'); document.getElementById('newCustName').value = ''; }
    }

    function saveDriver() {
      const name = document.getElementById('newDriverName').value.trim();
      if(name) { db.drivers.push(name); saveDB(); updateDropdowns(); closeModal('addDriverModal'); document.getElementById('newDriverName').value = ''; }
    }

    function saveBox() {
      const boxNum = document.getElementById('newBoxNum').value.trim();
      if(!boxNum) return alert('Box number is required.');

      db.boxes.push({
        id: Date.now().toString(),
        boxNum: boxNum,
        size: document.getElementById('newBoxSize').value,
        customer: document.getElementById('newBoxCustomer').value,
        driver: document.getElementById('newBoxDriver').value,
        address: document.getElementById('newBoxAddress').value.trim() || 'Yard',
        status: document.getElementById('newBoxStatus').value,
        notes: document.getElementById('newBoxNotes').value.trim() || 'None'
      });

      saveDB();
      renderApp();
      closeModal('addBoxModal');
      document.getElementById('newBoxNum').value = '';
      document.getElementById('newBoxAddress').value = '';
    }

    function openEditStatus(id) {
      activeEditBoxId = id;
      const box = db.boxes.find(b => b.id === id);
      if(box) {
        document.getElementById('editStatusVal').value = box.status;
        document.getElementById('editAddressVal').value = box.address;
        openModal('editStatusModal');
      }
    }

    function commitStatusUpdate() {
      const box = db.boxes.find(b => b.id === activeEditBoxId);
      if(box) {
        box.status = document.getElementById('editStatusVal').value;
        box.address = document.getElementById('editAddressVal').value.trim() || 'Yard';
        saveDB();
        renderApp();
        closeModal('editStatusModal');
      }
    }

    function deleteBox(id) {
      if(confirm('Are you sure you want to delete this box?')) {
        db.boxes = db.boxes.filter(b => b.id !== id);
        saveDB();
        renderApp();
      }
    }

    function renderApp() {
      updateDropdowns();
      const filter = document.getElementById('statusFilter').value;
      const container = document.getElementById('contentList');
      container.innerHTML = '';

      const filtered = db.boxes.filter(b => filter === 'ALL' || b.status === filter);
      document.getElementById('boxCount').innerText = `BOXES (${filtered.length})`;

      if(filtered.length === 0) {
        container.innerHTML = `<div class="empty-msg">No boxes found.<br>Tap <b>+ Add Box</b> above to create your first container.</div>`;
        return;
      }

      filtered.forEach(b => {
        const card = document.createElement('div');
        card.className = 'box-card';
        card.innerHTML = `
          <div class="box-header">
            <span>Box ${b.boxNum} (${b.size}Y)</span>
            <span class="badge badge-${b.status}">${b.status}</span>
          </div>
          <div class="box-info">
            <div>👤 <b>Cust:</b> ${b.customer}</div>
            <div>🚚 <b>Driver:</b> ${b.driver}</div>
            <div style="grid-column: span 2;">📍 <b>Location:</b> ${b.address}</div>
            <div style="grid-column: span 2;">📝 <b>Notes:</b> ${b.notes}</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-green" style="flex:1;" onclick="openEditStatus('${b.id}')">🔄 Update Status / Location</button>
            ${currentRole === 'Admin' ? `<button class="btn btn-danger" onclick="deleteBox('${b.id}')">🗑️ Delete</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Initial launch
    renderApp();
  </script>
</body>
</html>
