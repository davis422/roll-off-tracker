    function buildAddress(street, city, state, zip) {
      const parts = [];
      if (street && street.trim()) parts.push(street.trim());
      if (city && city.trim()) parts.push(city.trim());
      if (state && state.trim()) parts.push(state.trim());
      if (zip && zip.trim()) parts.push(zip.trim());
      return parts.join(", ");
    }

    function geocodeAddress(address) {
      return new Promise((resolve) => {
        if (!address || address.length < 5) return resolve(null);
        const geocoder = new google.maps.Geocoder();
        geocoder.geocode({ address: address }, (results, status) => {
          if (status === 'OK' && results[0]) {
            resolve({ lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng(), address: results[0].formatted_address });
          } else {
            resolve(null);
          }
        });
      });
    }

      const byUser = by || (currentUser ? (currentUser.displayName || "User") : "System");
      db.collection("customers").doc(customer.id).update({

          boxId: boxId || null,

    }

    function refreshMarkers() {
      if (!gMap) return;
      gMarkers.forEach(m => m.setMap(null));
      gMarkers = [];

      const yardBoxes = [];
      
      boxesData.forEach(b => {
        if (b.lat == null || b.lng == null) return;
        if (b.boxNum === "New") return;
        
        if (b.status === "Available" && yardData && yardData.lat) {
          yardBoxes.push(b);
          return;
        }
        
        const marker = new google.maps.Marker({
          position: { lat: b.lat, lng: b.lng },
          map: gMap,
          label: { text: "#" + b.boxNum, color: "white", fontWeight: "800", fontSize: "12px" },
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 12,
            fillColor: (b.status === "Delivery") ? "#dc2626" : (b.status === "Customer") ? "#16a34a" : (b.status === "Pickup") ? "#d97706" : (b.status === "Exchange") ? "#2563eb" : "#64748b",
            fillOpacity: 1, strokeColor: "#ffffff", strokeWeight: 2
          }
        });
        marker.addListener("click", () => selectBox(b.id));
        gMarkers.push(marker);
      });

      if (yardBoxes.length > 0 && yardData && yardData.lat) {
        const icon = {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 20,
          fillColor: "#64748b",
          fillOpacity: 1,
          strokeColor: "#ffffff",
          strokeWeight: 3
        };
        
        yardMarker = new google.maps.Marker({
          position: { lat: yardData.lat, lng: yardData.lng },
          map: gMap,
          label: { text: String(yardBoxes.length), color: "white", fontWeight: "900", fontSize: "14px" },
          icon: icon
        });
        
        let listHtml = '<div style="font-weight:bold; margin-bottom:8px;">Boxes in Yard:</div>';
        yardBoxes.forEach(b => {
          listHtml += `<div style="cursor:pointer; padding:4px 0; border-bottom:1px solid #eee;" onclick="selectBox('${b.id}')">#${b.boxNum} (${b.size}Y)</div>`;
        });
        
        yardInfoWindow = new google.maps.InfoWindow({
          content: listHtml
        });
        
        yardMarker.addListener("click", () => {
          yardInfoWindow.open(gMap, yardMarker);
        });
        
        gMarkers.push(yardMarker);
      }
    }

    function renderApp() {
      const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      const filter = document.getElementById("statusFilter").value;
      
      const filtered = boxesData.filter(b => {
        if (b.boxNum === "New") return false;
        if (filter !== "ALL" && b.status !== filter) return false;
        if (!search) return true;
        const hay = [b.boxNum, b.customer, b.street, b.city, b.state, b.zip, b.driver, b.notes].join(" ").toLowerCase();
        return hay.includes(search);
      });
      
      document.getElementById("boxCountTitle").textContent = "BOXES (" + filtered.length + ")";
      const listEl = document.getElementById("boxList");
      
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-msg"><h3>No boxes found</h3></div>';
      } else {
        listEl.innerHTML = filtered.map(b => {
          const fullAddress = buildAddress(b.street, b.city, b.state, b.zip);
          return `<div class="box-item ${b.id === activeBoxId ? "active" : ""}" onclick="selectBox('${b.id}')">
            <div class="box-item-title"><span class="dot dot-${b.status || "Available"}"></span> #${b.boxNum}</div>
            <div class="box-item-addr">${fullAddress || "No address"}</div>
            <div class="box-item-status">${statusLabel(b.status)} - ${b.customer || ""}</div>
          </div>`;
        }).join("");
      }
      refreshMarkers();
      renderDetail();
    }

    function renderService() {
      const el = document.getElementById("serviceList");
      const alertContainer = document.getElementById("serviceAlertContainer");
      const serviceBoxes = boxesData.filter(b => 
        (b.status === "Pickup" || b.status === "Exchange" || b.status === "Delivery")
      );
      
      if (serviceBoxes.length === 0) {
        alertContainer.innerHTML = '';
        el.innerHTML = '<div class="empty-msg"><h3>🎉 No boxes need service!</h3><p>Great job catching up!</p></div>';
        return;
      }

      alertContainer.innerHTML = `<div class="service-alert">🔥 ${serviceBoxes.length} Box${serviceBoxes.length > 1 ? 'es' : ''} Ready for Service!</div>`;
      
      el.innerHTML = serviceBoxes.map(b => {
        const nextStatus = (b.status === "Pickup") ? "Available" : (b.status === "Delivery") ? "Customer" : "Customer";
        const nextLabel = (b.status === "Pickup") ? "Mark as Available" : (b.status === "Delivery") ? "Enter Box # & Complete" : "Complete";

    function saveJobDriver(jobId) {
      const newDriver = document.getElementById("jobDriverSelect").value;
      db.collection("boxes").doc(jobId).update({
        driver: newDriver || "Unassigned",
        activity: firebase.firestore.FieldValue.arrayUnion({
          time: new Date().toLocaleString(),
          text: "Driver assigned to: " + (newDriver || "Unassigned"),
          by: currentUser ? (currentUser.displayName || "User") : "Dispatch"
        })
      }).then(() => {
        showToast("✅ Driver updated!");

        if (box) renderJobDetail(box);

      const notes = document.getElementById("jobNotesTextarea").value.trim();
      db.collection("boxes").doc(jobId).update({
        notes: notes,
        activity: firebase.firestore.FieldValue.arrayUnion({
          time: new Date().toLocaleString(),
          text: "Notes updated: " + (notes || "cleared"),
          by: currentUser ? (currentUser.displayName || "User") : "Dispatch"
        })

    // ============================================================
    // EXISTING FUNCTIONS
    // ============================================================
    function sendSMS(boxId) {
      const box = boxesData.find(b => b.id === boxId);
      if (!box) return;
      const driverObj = driversData.find(d => d.name === box.driver);
      const phone = driverObj ? driverObj.phone : "";
      if (!phone) {
        alert("No phone number found for driver: " + box.driver);
        return;
      }
      const fullAddress = buildAddress(box.street, box.city, box.state, box.zip);
      const message = `NIAM TRACK: Box #${box.boxNum} is ${statusLabel(box.status)} for ${box.customer || "Customer"} at ${fullAddress || "Address"}. ${box.notes ? "Note: " + box.notes : ""}`;
      window.location.href = `sms:${phone}?body=${encodeURIComponent(message)}`;
      showToast("📱 Opening SMS...");
    }

    function promptAddNote(boxId) {
      const box = boxesData.find(b => b.id === boxId);
      if (!box) return;
      const newNote = prompt("Enter Dispatcher Note:\n(Current: " + (box.notes || "None") + ")", "");
      if (newNote !== null) {
        db.collection("boxes").doc(boxId).update({
          notes: newNote,
          activity: firebase.firestore.FieldValue.arrayUnion({
            time: new Date().toLocaleString(),
            text: "Note added: " + newNote,
            by: currentUser ? (currentUser.displayName || "User") : "Dispatch"
          })
        }).then(() => showToast("✅ Note Saved!")).catch(e => alert("Error: " + e.message));
      }
    }

    function renderBoxes() {
      const el = document.getElementById("boxesList");
      const filteredBoxes = boxesData.filter(b => b.boxNum !== "New");
      if (filteredBoxes.length === 0) { 
        el.innerHTML = '<div class="empty-msg"><h3>No boxes yet</h3></div>'; 
        return; 
      }
      el.innerHTML = filteredBoxes.map(b => {
        const shouldShowDriver = (b.driver && b.driver !== "Unassigned" && (b.status !== "Available" && b.status !== "Customer"));
        const driverLine = shouldShowDriver ? `<p><strong>Driver:</strong> ${b.driver}</p>` : '';
        const fullAddress = buildAddress(b.street, b.city, b.state, b.zip);
        return `<div class="box-card ${b.status || "Available"}" onclick="selectBox('${b.id}')" style="cursor:pointer;">
          <h3>Box #${b.boxNum} - ${statusLabel(b.status)}</h3>
          <p><strong>Customer:</strong> ${b.customer || "N/A"}</p>
          <p><strong>Address:</strong> ${fullAddress || "N/A"}</p>
          ${driverLine}
        </div>`;
      }).join("");
    }

    // ============================================================
    // DRIVERS VIEW
    // ============================================================
    function renderDrivers() {
      const el = document.getElementById("driversList");
      
      const driverUsers = usersData.filter(u => u.role === 'driver');
      const allDrivers = driversData || [];
      
      const combinedDrivers = [];
      const existingNames = new Set();
      
      driverUsers.forEach(u => {
        const name = u.name || u.email || 'Unnamed';
        combinedDrivers.push({
          id: u.id,
          name: name,
          phone: u.phone || 'No phone',
          source: 'user',
          userData: u
        });
        existingNames.add(name);
      });
      
      allDrivers.forEach(d => {
        const name = d.name || 'Unnamed';
        const exists = combinedDrivers.some(cd => cd.name === name && cd.source === 'user');
        if (!exists) {
          combinedDrivers.push({
            id: d.id,
            name: name,
            phone: d.phone || 'No phone',
            source: 'driver-collection',
            driverData: d
          });
        }
      });
      
      if (combinedDrivers.length === 0) {
        el.innerHTML = '<div class="empty-msg"><h3>No drivers yet</h3></div>';
        return;
      }
      
      el.innerHTML = combinedDrivers.map(driver => {
        const assignedBoxes = boxesData.filter(b => b.driver === driver.name && b.boxNum !== "New");
        const boxCount = assignedBoxes.length;
        let boxesList = '';
        if (boxCount > 0) {
          boxesList = assignedBoxes.map(b => {
            return `<span style="display:inline-block; background:#e2e8f0; padding:2px 10px; border-radius:12px; font-size:0.75rem; margin:2px; color:#0f172a;">#${b.boxNum}</span>`;
          }).join('');
        } else {
          boxesList = '<span style="color:#94a3b8; font-size:0.8rem;">None assigned</span>';
        }
        
        const isUserSource = driver.source === 'user';
        const deleteButton = isUserSource ? 
          `<span style="font-size:0.75rem; color:#94a3b8;">(Managed via Users tab)</span>` :
          `<button class="btn-act btn-act-danger" onclick="deleteDriver('${driver.id}')">🗑️ Delete</button>`;
        
        return `
          <div class="driver-card" onclick="selectDriver('${driver.id}')" style="cursor:pointer;">
            <h3>🚛 ${driver.name}</h3>
            <p><strong>Phone:</strong> ${driver.phone}</p>
            <p><strong>Assigned Boxes:</strong> ${boxCount}</p>
            <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;">
              ${boxesList}
            </div>
            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;" onclick="event.stopPropagation();">
              ${deleteButton}
            </div>
          </div>
        `;
      }).join("");
    }

    function selectDriver(driverId) {
      let driver = driversData.find(d => d.id === driverId);
      let source = 'driver-collection';
      
      if (!driver) {
        const user = usersData.find(u => u.id === driverId && u.role === 'driver');
        if (user) {
          driver = {
            id: user.id,
            name: user.name || user.email || 'Unnamed',
            phone: user.phone || 'No phone'
          };
          source = 'user';
        }
      }
      
      if (!driver) {
        alert('Driver not found');
        return;
      }
      
      activeDriverId = driverId;
      activeBoxId = null;
      activeJobId = null;
      activeCustomerIdForDetail = null;
      const assignedBoxes = boxesData.filter(b => b.driver === driver.name && b.boxNum !== "New");
      const content = document.getElementById("detailContent");
      const empty = document.getElementById("detailEmpty");
      empty.style.display = "none";
      content.style.display = "block";
      let boxesHtml = '';
      if (assignedBoxes.length === 0) {
        boxesHtml = '<p style="color:#94a3b8;">No boxes currently assigned.</p>';
      } else {
        boxesHtml = assignedBoxes.map(b => {
          const fullAddress = buildAddress(b.street, b.city, b.state, b.zip);
          return `<div style="padding:8px 12px; background:#f8fafc; border-radius:6px; margin-bottom:6px; border-left:3px solid #16a34a; cursor:pointer;" onclick="selectBox('${b.id}')">
            <strong>#${b.boxNum}</strong> - ${statusLabel(b.status)}<br>
            <span style="font-size:0.8rem; color:#64748b;">${b.customer || "Yard"} | ${fullAddress || "No address"}</span>
          </div>`;
        }).join('');
      }
      
      const deleteButton = source === 'user' ? 
        `<span style="font-size:0.75rem; color:#94a3b8;">Managed via Users tab</span>` :
        `<button class="btn-act btn-act-danger" onclick="deleteDriver('${driver.id}')">🗑️ Delete Driver</button>`;
      
      content.innerHTML = `
        <div class="detail-title" style="font-size:1.3rem;">🚛 ${driver.name}</div>
        <div class="detail-layout">
          <div class="info-grid" style="grid-template-columns:1fr;">
            <div><div class="info-label">Phone</div><div class="info-val">${driver.phone || "No phone"}</div></div>
            <div><div class="info-label">Assigned Boxes</div><div class="info-val">${assignedBoxes.length}</div></div>
          </div>
        </div>
        <div style="margin-top:16px;">
          <div class="activity-title">Assigned Boxes</div>
          ${boxesHtml}
        </div>
        <div class="actions-row" style="margin-top:16px;">
          ${deleteButton}
        </div>
      `;
      
      if (window.innerWidth <= 900) {
        document.getElementById("detailPanel").classList.add("show");
      }
      document.getElementById("detailPanel").style.display = "block";
      toggleDrawer(false);
    }

    // DETAIL PANEL - unified dispatcher
    // ============================================================
    function renderDetail() {
      if (activeCustomerIdForDetail) {
        const customer = customersData.find(c => c.id === activeCustomerIdForDetail);

          renderCustomerDetail(customer);
          return;
        } else {
          activeCustomerIdForDetail = null;
        }
      }
      if (activeJobId) {
        const job = boxesData.find(b => b.id === activeJobId);
        if (job) {
          renderJobDetail(job);
          return;
        } else {
          activeJobId = null;
        }
      }
      if (activeBoxId) {
        const box = boxesData.find(b => b.id === activeBoxId);
        if (box) {
          renderBoxDetail(box);
          return;
        } else {
          activeBoxId = null;
        }
      }
      const empty = document.getElementById("detailEmpty");
      const content = document.getElementById("detailContent");
      empty.style.display = "block";
      content.style.display = "none";
    }

    function renderBoxDetail(box) {
      const empty = document.getElementById("detailEmpty");
      const content = document.getElementById("detailContent");

    // ============================================================
    // CONFIRM QUICK STATUS & QUICK STATUS
    // ============================================================
    function confirmQuickStatus(newStatus) {
      const statusLabels = {
        'Pickup': 'Ready for Pickup',
        'Exchange': 'Ready for Exchange',
        'Available': 'Available (Yard)'
      };
      const label = statusLabels[newStatus] || newStatus;
      if (confirm(`Are you sure you want to mark this box as "${label}"?`)) {
        quickStatus(newStatus);
      }
    }

    function quickStatus(newStatus) {
      if (!activeBoxId) return;
      const box = boxesData.find(b => b.id === activeBoxId);
      if (!box) return;
      
      let updateData = {
        status: newStatus,
        activity: firebase.firestore.FieldValue.arrayUnion({ 
          time: new Date().toLocaleString(), 
          text: "Status → " + statusLabel(newStatus), 
          by: currentUser ? (currentUser.displayName || "User") : "Driver/Admin" 
        })
      };
      
      let customerName = box.customer && box.customer !== "Yard" ? box.customer : null;
      
      if (newStatus === "Available") {
        if (yardData) {
          updateData.customer = "Yard";
          updateData.street = yardData.street || "";
          updateData.city = yardData.city || "";
          updateData.state = yardData.state || "";
          updateData.zip = yardData.zip || "";
          updateData.address = yardData.formattedAddress || buildAddress(yardData.street, yardData.city, yardData.state, yardData.zip);
          updateData.driver = "Unassigned";
          updateData.lat = yardData.lat;
          updateData.lng = yardData.lng;
        } else {
          updateData.customer = "Yard";
          updateData.street = "";
          updateData.city = "";
          updateData.state = "";
          updateData.zip = "";
          updateData.address = "Yard";
          updateData.driver = "Unassigned";
          updateData.lat = null;
          updateData.lng = null;
        }
        if (customerName) {
          addCustomerActivity(customerName, `Box #${box.boxNum || 'New'} picked up (moved to yard)`, box.id);
        }
      } else {
        if (customerName) {
          const actionText = newStatus === 'Pickup' ? 'marked for pickup' : 'marked for exchange';
          addCustomerActivity(customerName, `Box #${box.boxNum || 'New'} ${actionText}`, box.id);
        }
      }
      
      db.collection("boxes").doc(activeBoxId).update(updateData).then(() => {
        showToast("✅ Status Updated!");
      }).catch(e => alert("Error: " + e.message));
    }

    async function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file || !activeBoxId) return;
      try {
        const storageRef = storage.ref(`box_photos/${activeBoxId}/${Date.now()}.jpg`);
        const uploadTask = await storageRef.put(file);
        const downloadURL = await uploadTask.ref.getDownloadURL();
        await db.collection("boxes").doc(activeBoxId).update({
          photoURL: downloadURL,
          activity: firebase.firestore.FieldValue.arrayUnion({
            time: new Date().toLocaleString(),
            text: "📸 Photo uploaded",
            by: currentUser ? (currentUser.displayName || "User") : "Driver"
          })
        });
        event.target.value = "";
        showToast("✅ Photo Uploaded!");
      } catch (e) {
        console.error("Photo upload error:", e);
        alert("Error uploading photo.");
      }
    }

    async function saveYardSettings() {
      const street = document.getElementById("yardStreet").value.trim();
      const city = document.getElementById("yardCity").value.trim();
      const state = document.getElementById("yardState").value.trim();
      const zip = document.getElementById("yardZip").value.trim();
      const fullAddress = buildAddress(street, city, state, zip);
      if (!street || !city || !state || !zip) return alert("Please complete the Yard Street, City, State, and ZIP fields.");
      const btn = document.querySelector('#yardSettingsModal .btn-save');
      btn.disabled = true;
      document.getElementById("yardGeoStatus").textContent = "Finding coordinates...";
      const geo = await geocodeAddress(fullAddress);
      if (!geo) {
        document.getElementById("yardGeoStatus").textContent = "Could not find coordinates for this address.";
        btn.disabled = false;
        return;
      }
      const yardObj = {
        street, city, state, zip,
        formattedAddress: geo.address,
        lat: geo.lat,
        lng: geo.lng
      };
      if (currentUser) {
        db.collection("users").where("email", "==", currentUser.email).get().then(snapshot => {
          if (!snapshot.empty) {
            db.collection("users").doc(snapshot.docs[0].id).update({ yard: yardObj })
              .then(() => {
                yardData = yardObj;
                document.getElementById("yardGeoStatus").textContent = "✓ Yard Location Saved!";
                showToast("✅ Yard Location Saved!");
                setTimeout(() => closeModal("yardSettingsModal"), 800);
                btn.disabled = false;
                refreshMarkers();
              }).catch(e => { alert("Error: " + e.message); btn.disabled = false; });
          } else {
            btn.disabled = false;
            alert("Could not find your user profile to save the yard location.");
          }
        }).catch(e => { btn.disabled = false; alert("Error: " + e.message); });
      } else {
        btn.disabled = false;
        alert("You must be logged in to save the yard location.");
      }
    }

    async function saveBox() {
      const boxNum = document.getElementById("newBoxNum").value.trim();
      if (!boxNum) return alert("Box number is required");
      const duplicateCheck = boxesData.some(b => b.boxNum === boxNum);
      if (duplicateCheck) return alert("A box with this number already exists!");
      
      const customerName = document.getElementById("newBoxCustomer").value;
      let street = document.getElementById("newBoxStreet").value.trim();
      let city = document.getElementById("newBoxCity").value.trim();
      let state = document.getElementById("newBoxState").value.trim();
      let zip = document.getElementById("newBoxZip").value.trim();

      if (customerName && (!street || !city || !state || !zip)) {
        const customer = customersData.find(c => c.name === customerName);
        if (customer && customer.address) {
          const parts = customer.address.split(", ").map(s => s.trim());
          street = parts[0] || "";
          city = parts[1] || "";
          state = parts[2] || "";
          zip = parts[3] || "";
          document.getElementById("newBoxStreet").value = street;
          document.getElementById("newBoxCity").value = city;
          document.getElementById("newBoxState").value = state;
          document.getElementById("newBoxZip").value = zip;
        }
      }

      if (!street || !city || !state || !zip) {
        return alert("Please complete the Street, City, State, and ZIP fields.");
      }
      
      const fullAddress = buildAddress(street, city, state, zip);
      const btn = document.getElementById("saveBoxBtn");
      btn.disabled = true; btn.textContent = "Saving...";

      let lat = pendingLatLng ? pendingLatLng.lat : null;
      let lng = pendingLatLng ? pendingLatLng.lng : null;
      if (!lat || !lng) {
        const geo = await geocodeAddress(fullAddress);
        if (geo) { lat = geo.lat; lng = geo.lng; document.getElementById("newGeoStatus").textContent = "✓ Address located!"; }
      }

      try {
        const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        await db.collection("boxes").add({
          boxNum: boxNum,
          size: document.getElementById("newBoxSize").value,
          customer: customerName || "Yard",
          driver: "Unassigned",
          street: street,
          city: city,
          state: state,
          zip: zip,
          address: fullAddress,
          lat: lat,
          lng: lng,
          status: document.getElementById("newBoxStatus").value,
          notes: document.getElementById("newBoxNotes").value.trim(),
          datePlaced: today,
          activity: [{ time: new Date().toLocaleString(), text: "Box created", by: currentUser ? (currentUser.displayName || "User") : "Admin" }],
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: currentUser ? currentUser.uid : null
        });
        pendingLatLng = null; placeMode = null;
        closeModal("addBoxModal");
        toggleFabMenu();
        showToast("✅ Box Added!");
      } catch (e) { alert("Error: " + e.message); }
      finally { btn.disabled = false; btn.textContent = "Save Box"; }
    }

    async function commitBoxUpdate() {
      if (!activeBoxId) return;
      
      const newBoxNum = document.getElementById("editBoxNum").value.trim();
      const newStatus = document.getElementById("editBoxStatus").value;
      const newCustomer = document.getElementById("editBoxCustomer").value;
      const newDriver = document.getElementById("editBoxDriver").value;
      const notes = document.getElementById("editBoxNotes").value.trim();
      
      const btn = document.getElementById("updateBoxBtn");
      btn.disabled = true; btn.textContent = "Updating...";

      const duplicateCheck = boxesData.some(b => b.boxNum === newBoxNum && b.id !== activeBoxId);
      if (duplicateCheck) {
        btn.disabled = false; btn.textContent = "Update Box";
        return alert("A box with this number already exists!");
      }

      let updateData = {
        boxNum: newBoxNum,
        status: newStatus,
        customer: newCustomer || "Yard",
        driver: newDriver || "Unassigned",
        notes: notes,
        activity: firebase.firestore.FieldValue.arrayUnion({
          time: new Date().toLocaleString(),
          text: "Updated to " + statusLabel(newStatus),
          by: currentUser ? (currentUser.displayName || "User") : "Admin"
        })
      };

      if (newCustomer) {
        const customer = customersData.find(c => c.name === newCustomer);
        if (customer && customer.address) {
          const parts = customer.address.split(", ").map(s => s.trim());
          updateData.street = parts[0] || "";
          updateData.city = parts[1] || "";
          updateData.state = parts[2] || "";
          updateData.zip = parts[3] || "";
          updateData.address = customer.address;
          const geo = await geocodeAddress(customer.address);
          if (geo) {
            updateData.lat = geo.lat;
            updateData.lng = geo.lng;
          }
        }
      } else {
        const street = document.getElementById("editBoxStreet").value.trim();
        const city = document.getElementById("editBoxCity").value.trim();
        const state = document.getElementById("editBoxState").value.trim();
        const zip = document.getElementById("editBoxZip").value.trim();
        updateData.street = street;
        updateData.city = city;
        updateData.state = state;
        updateData.zip = zip;
        updateData.address = buildAddress(street, city, state, zip);
        if (!pendingLatLng) {
          const geo = await geocodeAddress(updateData.address);
          if (geo) {
            updateData.lat = geo.lat;
            updateData.lng = geo.lng;
          }
        } else {
          updateData.lat = pendingLatLng.lat;
          updateData.lng = pendingLatLng.lng;
        }
      }

      const oldBox = boxesData.find(b => b.id === activeBoxId);
      if (oldBox && newCustomer && newCustomer !== oldBox.customer) {
        addCustomerActivity(newCustomer, `Box #${newBoxNum} assigned to customer`, activeBoxId);
      }

      try {
        await db.collection("boxes").doc(activeBoxId).update(updateData);
        closeModal("editBoxModal");
        showToast("✅ Box Updated!");
      } catch (e) { alert("Error: " + e.message); }
      finally { btn.disabled = false; btn.textContent = "Update Box"; }
    }

    // ============================================================
    // DELETE USER - with master admin protection
    // ============================================================
    function deleteUser(id) {
      // Prevent deleting your own account
      if (currentUser && id === currentUser.uid) {
        alert("⚠️ You cannot delete your own account.");
        return;
      }
      
      const user = usersData.find(u => u.id === id);
      if (!user) return;
      
      // Master admin protection – nobody can delete this account
      if (user.email === MASTER_ADMIN_EMAIL) {
        alert("🔒 This account is the master admin and cannot be deleted.");
        return;
      }
      
      if (!confirm(`Delete user "${user.name || user.email}"?`)) return;
      
      if (user.role === 'driver') {
        const driverToDelete = driversData.find(d => d.name === user.name || d.name === user.email);
        if (driverToDelete) {
          db.collection("drivers").doc(driverToDelete.id).delete()
            .catch(e => console.warn("Could not delete driver document:", e));
        }
      }
      
      db.collection("users").doc(id).delete()
        .then(() => showToast("User Deleted"))
        .catch(e => alert(e.message));
    }

    // ============================================================
    // RENDER USERS - with master admin protection
    // ============================================================
    function renderUsers() {
      const el = document.getElementById("usersList");
      if (usersData.length === 0) {
        el.innerHTML = '<div class="empty-msg"><h3>No users yet</h3></div>';
        return;
      }
      el.innerHTML = usersData.map(u => {
        const isMaster = u.email === MASTER_ADMIN_EMAIL;
        const deleteButton = isMaster
          ? `<span style="font-size:0.75rem; color:#94a3b8; background:#f1f5f9; padding:4px 8px; border-radius:4px;">🔒 Protected</span>`
          : `<button class="btn-act btn-act-danger" onclick="deleteUser('${u.id}')">🗑️ Delete</button>`;
        
        return `
          <div class="user-item">
            <div class="user-info">
              <strong>${u.name || u.email}</strong><br>
              <span style="font-size:0.8rem;color:#64748b">${u.email}</span><br>
              <span style="font-size:0.8rem;color:#64748b">Phone: ${u.phone || "N/A"}</span><br>
              <span style="font-size:0.8rem;color:#64748b">Role: ${u.role}</span>
            </div>
            <div class="user-actions">
              <button class="btn-act btn-act-blue" onclick="openEditUserModal('${u.id}')">✏️ Edit</button>
              ${deleteButton}
            </div>
          </div>
        `;
      }).join("");
    }

    function openEditUserModal(id) {
      const user = usersData.find(u => u.id === id);
      if (!user) return;
      editingUserId = id;
      document.getElementById("editUserEmail").value = user.email || "";
      document.getElementById("editUserName").value = user.name || "";
      document.getElementById("editUserPhone").value = user.phone || "";
      document.getElementById("editUserRole").value = user.role || "driver";
      openModal("editUserModal");
    }

    async function commitUserUpdate() {
      if (!editingUserId) return;
      const name = document.getElementById("editUserName").value.trim();
      const phone = document.getElementById("editUserPhone").value.trim();
      const newRole = document.getElementById("editUserRole").value;
      if (!name) return alert("Name is required");
      
      const user = usersData.find(u => u.id === editingUserId);
      if (!user) return;

      const oldRole = user.role;
      
      const updateData = {
        name: name,
        phone: phone,
        role: newRole
      };

      try {
        await db.collection("users").doc(editingUserId).update(updateData);
        
        if (oldRole === "driver" && newRole !== "driver") {
          const driverToDelete = driversData.find(d => d.name === user.name || d.name === user.email);
          if (driverToDelete) {
            await db.collection("drivers").doc(driverToDelete.id).delete().catch(e => console.warn("Could not delete driver:", e));
          }
        } else if (oldRole !== "driver" && newRole === "driver") {
          await db.collection("drivers").add({
            name: name,
            phone: phone,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(e => console.warn("Could not add driver:", e));
        } else if (oldRole === "driver" && newRole === "driver") {
          const driverToUpdate = driversData.find(d => d.name === user.name || d.name === user.email);
          if (driverToUpdate) {
            await db.collection("drivers").doc(driverToUpdate.id).update({
              name: name,
              phone: phone
            }).catch(e => console.warn("Could not update driver:", e));
          }
        }
        
        closeModal("editUserModal");
        showToast("✅ User Updated!");
      } catch (e) {
        alert("Error updating user: " + e.message);
      }
    }

    // ============================================================
    // DELIVERY / PICKUP / EXCHANGE WORKFLOW
    // ============================================================
    function openDeliveryNotes(customerId) {
      const customer = customersData.find(c => c.id === customerId);
      if (!customer) return;
      if (!customer.address) {
        alert("This customer does not have an address. Please edit the customer to add an address first.");
        return;
      }
      pendingDeliveryCustomerId = customerId;
      document.getElementById("deliveryCustomerInfo").textContent = "Customer: " + customer.name + " | Address: " + customer.address;
      document.getElementById("deliveryNoteText").value = "";
      openModal("deliveryNotesModal");
    }

    function confirmSendForDelivery() {
      if (!pendingDeliveryCustomerId) return;
      const customer = customersData.find(c => c.id === pendingDeliveryCustomerId);
      if (!customer) return;
      const note = document.getElementById("deliveryNoteText").value.trim();
      const finalNotes = note || "New customer delivery";
      
      addCustomerActivity(customer.name, `Delivery scheduled (New box)`, null);
      
      db.collection("boxes").add({
        boxNum: "New",
        size: customer.boxSize || "Not specified",
        customer: customer.name,
        driver: "Unassigned",
        street: "", city: "", state: "", zip: "",
        address: customer.address,
        lat: null, lng: null,
        status: "Delivery",
        notes: finalNotes,
        datePlaced: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        activity: [{ time: new Date().toLocaleString(), text: "Delivery scheduled" + (note ? " with note" : ""), by: currentUser ? (currentUser.displayName || "User") : "Office" }],
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdBy: currentUser ? currentUser.uid : null
      }).then(() => {
        closeModal("deliveryNotesModal");
        pendingDeliveryCustomerId = null;
        showToast("✅ Delivery Scheduled with Notes!");
      }).catch(e => alert("Error: " + e.message));
    }

    function openDispatchNotes(boxId, status) {
      pendingActionBoxId = boxId;
      pendingActionStatus = status;
      const box = boxesData.find(b => b.id === boxId);
      if (!box) return;
      
      populateDispatchDriverSelect();
      
      document.getElementById("dispatchModalTitle").textContent = status === "Exchange" ? "Schedule Exchange" : "Schedule Pickup";
      document.getElementById("dispatchBoxInfo").textContent = `Box #${box.boxNum} - ${box.customer}`;
      document.getElementById("dispatchNoteText").value = box.notes || "";
      document.getElementById("dispatchDriverSelect").value = "";
      openModal("dispatchNotesModal");
    }

    function confirmSendToService() {
      if (!pendingActionBoxId) return;
      
      const note = document.getElementById("dispatchNoteText").value.trim();
      const assignedDriver = document.getElementById("dispatchDriverSelect").value;
      const box = boxesData.find(b => b.id === pendingActionBoxId);
      
      const updateData = {
        status: pendingActionStatus,
        notes: note || "",
        driver: assignedDriver || "Unassigned",
        activity: firebase.firestore.FieldValue.arrayUnion({
          time: new Date().toLocaleString(),
          text: "Status → " + statusLabel(pendingActionStatus) + (note ? " with note" : "") + (assignedDriver ? " assigned to " + assignedDriver : ""),
          by: currentUser ? (currentUser.displayName || "User") : "Dispatch"
        })
      };
      
      if (box && box.customer && box.customer !== "Yard") {
        const actionText = pendingActionStatus === 'Pickup' ? 'Pickup scheduled' : 'Exchange scheduled';
        addCustomerActivity(box.customer, `Box #${box.boxNum || 'New'} ${actionText}`, box.id);
      }
      
      db.collection("boxes").doc(pendingActionBoxId).update(updateData)
        .then(() => {
          closeModal("dispatchNotesModal");
          pendingActionBoxId = null;
          pendingActionStatus = null;
          showToast("✅ Sent to Service!" + (assignedDriver ? " Driver: " + assignedDriver : ""));
        }).catch(e => alert("Error: " + e.message));
    }

    function completeTask(id, newStatus, label, currentStatus) {
      if (!confirm(`Are you sure you want to mark this box as ${label}?`)) return;
      
      if (currentStatus === "Delivery") {
        pendingDeliveryBoxId = id;
        openModal("boxNumberModal");
        return;
      }

      const box = boxesData.find(b => b.id === id);
      
      let updateData = {
        status: newStatus,
        activity: firebase.firestore.FieldValue.arrayUnion({
          time: new Date().toLocaleString(),
          text: "Task Complete → " + statusLabel(newStatus),
          by: currentUser ? (currentUser.displayName || "User") : "Driver"
        })
      };

      if (newStatus === "Available") {
        if (yardData && yardData.lat) {
          updateData.customer = "Yard";
          updateData.street = yardData.street || "";
          updateData.city = yardData.city || "";
          updateData.state = yardData.state || "";
          updateData.zip = yardData.zip || "";
          updateData.address = yardData.formattedAddress || buildAddress(yardData.street, yardData.city, yardData.state, yardData.zip);
          updateData.driver = "Unassigned";
          updateData.lat = yardData.lat;
          updateData.lng = yardData.lng;
        } else {
          updateData.customer = "Yard";
          updateData.street = "";
          updateData.city = "";
          updateData.state = "";
          updateData.zip = "";
          updateData.address = "Yard";
          updateData.driver = "Unassigned";
          updateData.lat = null;
          updateData.lng = null;
        }
        if (box && box.customer && box.customer !== "Yard") {
          addCustomerActivity(box.customer, `Box #${box.boxNum || 'New'} picked up (completed)`, box.id);
        }
      }

      if (newStatus === "Customer") {
        if (box && box.customer) {
          const customer = customersData.find(c => c.name === box.customer);
          if (customer && customer.address) {
            const parts = customer.address.split(", ").map(s => s.trim());
            updateData.street = parts[0] || "";
            updateData.city = parts[1] || "";
            updateData.state = parts[2] || "";
            updateData.zip = parts[3] || "";
            updateData.address = customer.address;
            geocodeAddress(customer.address).then(geo => {
              if (geo) {
                db.collection("boxes").doc(id).update({ lat: geo.lat, lng: geo.lng });
              }
            });
          }
          addCustomerActivity(box.customer, `Box #${box.boxNum || 'New'} exchange completed (at customer)`, box.id);
        }
      }

      db.collection("boxes").doc(id).update(updateData)
        .then(() => showToast("✅ Task Completed!"))
        .catch(e => alert("Error: " + e.message));
    }

    async function confirmCompleteDelivery() {
      const boxNum = document.getElementById("deliveredBoxNum").value.trim();
      if (!boxNum) {
        alert("Please enter the box number");
        return;
      }
      if (!pendingDeliveryBoxId) {
        alert("No delivery in progress");
        return;
      }
      const deliveryBox = boxesData.find(b => b.id === pendingDeliveryBoxId);
      if (!deliveryBox) {
        alert("Delivery job not found");
        return;
      }

      const boxExists = boxesData.some(b => b.boxNum === boxNum);
      if (!boxExists) {
        document.getElementById("missingBoxNum").textContent = boxNum;
        document.getElementById("boxNotFoundError").style.display = "block";
        document.getElementById("boxNotAvailableError").style.display = "none";
        document.getElementById("deliveredBoxNum").classList.add("input-error");
        document.getElementById("deliveredBoxNum").focus();
        document.getElementById("deliveredBoxNum").select();
        return;
      }

      const existingBox = boxesData.find(b => b.boxNum === boxNum && b.status === "Available");
      if (!existingBox) {
        const boxStatus = boxesData.find(b => b.boxNum === boxNum)?.status || "unknown";
        document.getElementById("unavailableBoxNum").textContent = boxNum + " (Current status: " + statusLabel(boxStatus) + ")";
        document.getElementById("boxNotAvailableError").style.display = "block";
        document.getElementById("boxNotFoundError").style.display = "none";
        document.getElementById("deliveredBoxNum").classList.add("input-error");
        document.getElementById("deliveredBoxNum").focus();
        document.getElementById("deliveredBoxNum").select();
        return;
      }

      clearBoxErrors();

      try {
        await db.collection("boxes").doc(pendingDeliveryBoxId).delete();
      } catch (e) {
        alert("Error removing delivery job: " + e.message);
        return;
      }

      let lat = null, lng = null;
      let street = "", city = "", state = "", zip = "", fullAddress = "";

      const customer = customersData.find(c => c.name === deliveryBox.customer);
      if (customer && customer.address) {
        const parts = customer.address.split(", ").map(s => s.trim());
        street = parts[0] || "";
        city = parts[1] || "";
        state = parts[2] || "";
        zip = parts[3] || "";
        fullAddress = customer.address;
        const geo = await geocodeAddress(customer.address);
        if (geo) {
          lat = geo.lat;
          lng = geo.lng;
        }
      }

      const updateData = {
        customer: deliveryBox.customer || "",
        street: street,
        city: city,
        state: state,
        zip: zip,
        address: fullAddress,
        status: "Customer",
        driver: "Unassigned",
        lat: lat,
        lng: lng,
        notes: deliveryBox.notes || "",
        activity: firebase.firestore.FieldValue.arrayUnion({
          time: new Date().toLocaleString(),
          text: "Delivered Box #" + boxNum + " to " + (deliveryBox.customer || "customer"),
          by: currentUser ? (currentUser.displayName || "User") : "Driver"
        })
      };

      if (deliveryBox.customer) {
        addCustomerActivity(deliveryBox.customer, `Box #${boxNum} delivered`, existingBox.id);
      }

      try {
        await db.collection("boxes").doc(existingBox.id).update(updateData);
        showToast("✅ Delivery Completed! Pin moved to customer address.");
      } catch (e) {
        alert("Error updating box: " + e.message);
      }

      closeModal("boxNumberModal");
      pendingDeliveryBoxId = null;
      document.getElementById("deliveredBoxNum").value = "";
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
      switchView('map');
    });

  </script>
</body>
