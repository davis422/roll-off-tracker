function lp(e){const d=devicePixelRatio||1;return{x:(e.clientX*d-OX)/S,y:(e.clientY*d-OY)/S}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=lp(e);if(st!=='play'){if(st==='title'||overT<=0)startGame();return}if(p.x>W*.55)dashReq=true;else joy={id:e.pointerId,ox:p.x,oy:p.y,x:p.x,y:p.y}});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){const p=lp(e);joy.x=p.x;joy.y=p.y;const dx=p.x-joy.ox,dy=p.y-joy.oy,l=Math.hypot(dx,dy);if(l>50){joy.ox=p.x-dx/l*50;joy.oy=p.y-dy/l*50}}});
const up=e=>{if(joy&&joy.id===e.pointerId)joy=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key.length==1?e.key.toLowerCase():e.key;keys[k]=true;au();if(k===' '||k==='Enter'){if(st==='play'){if(k===' ')dashReq=true}else if(st==='title'||overT<=0)startGame();e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=false});
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
