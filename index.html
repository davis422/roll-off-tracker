<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treble Clef Flash Cards</title>
<style>
  :root{--bg:#14161c;--card:#fdfaf3;--ink:#1d1d22;--accent:#4f7cff;--good:#2ecc71;--bad:#e74c3c;--muted:#8b90a0;--gold:#f5c542}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#232838,var(--bg));color:#eef0f6;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
  h1{margin:0 0 4px;font-size:1.6rem}
  .sub{color:var(--muted);margin-bottom:16px;font-size:.95rem}
  .stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
  .stat{background:#1f2330;border-radius:12px;padding:8px 16px;text-align:center;min-width:80px}
  .stat b{display:block;font-size:1.4rem}
  .stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

  .practice-hud{display:none;gap:10px;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
  .practice-hud.on{display:flex}
  .pstat{background:#1a2030;border:1px solid #2c3550;border-radius:12px;padding:8px 16px;text-align:center;min-width:96px}
  .pstat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
  .pstat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pstat.live b{color:var(--gold)}
  .pstat.best b{color:var(--good)}
  .pstat.avg b{color:var(--accent)}

  .card{background:var(--card);border-radius:20px;width:100%;max-width:560px;padding:10px;box-shadow:0 12px 40px #0008;transition:box-shadow .2s,transform .2s}
  .card.good{box-shadow:0 0 0 4px var(--good),0 12px 40px #0008}
  .card.bad{box-shadow:0 0 0 4px var(--bad),0 12px 40px #0008;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
  svg{width:100%;height:auto;display:block}
  .msg{height:28px;margin:10px 0;font-weight:600;font-size:1.1rem;font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;align-items:center}
  .seg{display:flex;background:#1f2330;border-radius:10px;overflow:hidden}
  .seg button{background:none;border:0;color:var(--muted);padding:9px 16px;font-size:.9rem;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  label.practice-label{color:var(--gold);font-weight:600}
  .piano{position:relative;width:100%;max-width:720px;height:170px;user-select:none;touch-action:manipulation}
  .wk{position:absolute;top:0;height:100%;background:#fff;border:1px solid #333;border-radius:0 0 8px 8px;cursor:pointer;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:#aaa;font-size:.7rem;transition:background .1s}
  .wk:hover{background:#e8efff}
  .wk:active{background:#cfdcff}
  .bk{position:absolute;top:0;height:60%;background:#111;border-radius:0 0 6px 6px;z-index:2;cursor:pointer}
  .flash-good{background:var(--good)!important}
  .flash-bad{background:var(--bad)!important}
  .letters{display:none;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
  .letters button{width:64px;height:64px;font-size:1.6rem;font-weight:700;border:0;border-radius:14px;background:#2a3042;color:#fff;cursor:pointer;transition:transform .08s,background .1s}
  .letters button:hover{background:var(--accent)}
  .letters button:active{transform:scale(.93)}
  .letters button.flash-good{color:#fff}
  .hint{color:var(--muted);font-size:.8rem;margin-top:14px;text-align:center}
  .skip{background:none;border:1px solid #333a50;color:var(--muted);border-radius:10px;padding:8px 14px;cursor:pointer}
  .skip:hover{color:#fff;border-color:#fff}
  .pb-badge{display:inline-block;margin-left:6px;font-size:.85rem;color:var(--gold);font-weight:700}
</style>
</head>
<body>
  <h1>🎼 Treble Clef Flash Cards</h1>
  <div class="sub">Name the note on the staff</div>

  <div class="stats">
    <div class="stat"><b id="score">0</b><span>Correct</span></div>
    <div class="stat"><b id="streak">0</b><span>Streak</span></div>
    <div class="stat"><b id="best">0</b><span>Best</span></div>
    <div class="stat"><b id="acc">–</b><span>Accuracy</span></div>
  </div>

  <div class="practice-hud" id="practiceHud">
    <div class="pstat live"><b id="pLive">0 ms</b><span>Live</span></div>
    <div class="pstat best"><b id="pBest">–</b><span>Session Best</span></div>
    <div class="pstat avg"><b id="pAvg">–</b><span>Session Avg</span></div>
    <div class="pstat"><b id="pCount">0</b><span>Timed</span></div>
  </div>

  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-mode="piano" class="on">🎹 Piano</button>
      <button data-mode="buttons">🔤 Buttons</button>
    </div>
    <label id="octaveLabel"><input type="checkbox" id="anyOctave"> Any octave counts</label>
    <label><input type="checkbox" id="sound" checked> Sound</label>
    <label><input type="checkbox" id="showNames"> Show key labels</label>
    <label class="practice-label"><input type="checkbox" id="practice"> ⏱️ Practice mode</label>
  </div>

  <div class="card" id="card">
    <svg viewBox="0 0 400 200" id="staff" aria-label="Musical staff"></svg>
  </div>
  <div class="msg" id="msg"></div>

  <div class="piano" id="piano"></div>
  <div class="letters" id="letters"></div>

  <div class="controls" style="margin-top:16px">
    <button class="skip" id="skip">Skip ⏭</button>
    <button class="skip" id="reset">Reset stats</button>
    <button class="skip" id="resetTiming">Reset timing</button>
  </div>
  <div class="hint">Tip: press <b>A–G</b> on your computer keyboard to answer too.</div>

<script>
(function(){
  // ---- Note data: diatonic index 0 = C4 ... 12 = A5 ----
  var NAMES = ['C','D','E','F','G','A','B'];
  // Display order for letter buttons: A..G
  var BUTTON_ORDER = ['A','B','C','D','E','F','G'];
  var MIN = 0, MAX = 12;                       // C4 .. A5
  function noteName(i){ return NAMES[i % 7]; }
  function octave(i){ return 4 + Math.floor(i / 7); }

  // ---- State ----
  var current = null, locked = false;
  var s = { score:0, streak:0, best:0, tries:0 };
  try { var saved = JSON.parse(localStorage.getItem('trebleFlash')||'null'); if(saved) s = Object.assign(s, saved); } catch(e){}
  function save(){ try{ localStorage.setItem('trebleFlash', JSON.stringify(s)); }catch(e){} }

  // ---- Timing ----
  var t = { on:false, start:0, liveId:0, times:[], best:null, avg:null, count:0 };
  try { var savedT = JSON.parse(localStorage.getItem('trebleFlashTiming')||'null'); if(savedT) Object.assign(t, savedT, {on:false, liveId:0}); } catch(e){}
  function saveTiming(){
    try{ localStorage.setItem('trebleFlashTiming', JSON.stringify({ best:t.best, avg:t.avg, count:t.count, times:t.times.slice(-50) })); }catch(e){}
  }

  var $ = function(id){ return document.getElementById(id); };
  var mode = 'piano';

  // ---- Staff drawing ----
  var LINE_Y = [60,76,92,108,124];
  var HALF = 8;
  function yFor(i){ return 124 - (i - 2) * HALF; }

  function drawStaff(i){
    var svg = $('staff'), h = '';
    LINE_Y.forEach(function(y){ h += '<line x1="20" x2="380" y1="'+y+'" y2="'+y+'" stroke="#222" stroke-width="1.6"/>'; });
    h += '<line x1="20" x2="20" y1="60" y2="124" stroke="#222" stroke-width="2"/>';
    h += '<text x="30" y="136" font-size="104" fill="#222" font-family="\'Noto Music\',\'Segoe UI Symbol\',\'Apple Symbols\',serif">\uD834\uDD1E</text>';
    if (i !== null){
      var y = yFor(i), x = 250;
      if (i <= 0) for (var l = 0; l >= i; l -= 2) h += ledger(x, yFor(l));
      if (i >= 12) for (var u = 12; u <= i; u += 2) h += ledger(x, yFor(u));
      var up = i < 6;
      h += '<g id="noteG">';
      h += up ? '<line x1="'+(x+10.5)+'" x2="'+(x+10.5)+'" y1="'+(y-1)+'" y2="'+(y-52)+'" stroke="#111" stroke-width="2.4"/>'
              : '<line x1="'+(x-10.5)+'" x2="'+(x-10.5)+'" y1="'+(y+1)+'" y2="'+(y+52)+'" stroke="#111" stroke-width="2.4"/>';
      h += '<ellipse cx="'+x+'" cy="'+y+'" rx="12" ry="8.2" fill="#111" transform="rotate(-20 '+x+' '+y+')"/>';
      h += '</g>';
    }
    svg.innerHTML = h;
  }
  function ledger(x,y){ return '<line x1="'+(x-22)+'" x2="'+(x+22)+'" y1="'+y+'" y2="'+y+'" stroke="#222" stroke-width="1.6"/>'; }

  // ---- Piano keyboard ----
  function buildPiano(){
    var p = $('piano'), n = MAX - MIN + 1, w = 100 / n, h = '';
    for (var i = MIN; i <= MAX; i++){
      h += '<div class="wk" data-i="'+i+'" style="left:'+((i-MIN)*w)+'%;width:'+w+'%"><span class="lbl"></span></div>';
    }
    for (var j = MIN; j < MAX; j++){
      var nm = noteName(j);
      if (nm === 'E' || nm === 'B') continue;
      h += '<div class="bk" data-black="1" style="left:'+(((j-MIN)+1)*w - w*0.3)+'%;width:'+(w*0.6)+'%"></div>';
    }
    p.innerHTML = h;
    p.addEventListener('pointerdown', function(e){
      var k = e.target.closest('.wk,.bk'); if(!k) return;
      if (k.dataset.black) return wrong(k, true);
      answer(+k.dataset.i, k);
    });
    updateLabels();
  }
  function updateLabels(){
    var on = $('showNames').checked;
    document.querySelectorAll('.wk').forEach(function(k){
      var i = +k.dataset.i;
      k.firstChild.textContent = on ? noteName(i) + octave(i) : (noteName(i)==='C' ? 'C'+octave(i) : '');
    });
  }

  // ---- Letter buttons (A..G order) ----
  function buildLetters(){
    var l = $('letters');
    l.innerHTML = BUTTON_ORDER.map(function(n){ return '<button data-n="'+n+'">'+n+'</button>'; }).join('');
    l.addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      answerLetter(b.dataset.n, b);
    });
  }

  // ---- Audio: piano-ish synth ----
  var ctx = null;
  var masterGain = null;
  function ensureAudio(){
    if (!ctx){
      try{
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = ctx.createGain();
        masterGain.gain.value = 0.9;
        masterGain.connect(ctx.destination);
      }catch(e){ return false; }
    }
    if (ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
    return true;
  }
  function freq(i){
    var semis = [0,2,4,5,7,9,11];
    var st = semis[i % 7] + 12 * Math.floor(i / 7);
    return 261.63 * Math.pow(2, st / 12);
  }

  // Piano-ish note: a few detuned harmonics with individual decay envelopes
  // + a short noise burst for the "hammer" attack.
  function playPiano(i, dur){
    if (!$('sound').checked) return;
    if (!ensureAudio()) return;
    dur = dur || 1.6;
    var f = freq(i);
    var now = ctx.currentTime;

    // Note output bus
    var bus = ctx.createGain();
    bus.gain.value = 0.28;

    // Gentle lowpass so upper harmonics aren't harsh
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = Math.min(6000, f * 8);
    lp.Q.value = 0.6;

    bus.connect(lp);
    lp.connect(masterGain);

    // Harmonics: [multiple, gain, decayScale]
    // Fundamental + a few upper partials with faster decay = piano-like
    var partials = [
      { m: 1, g: 1.00, d: 1.00 },
      { m: 2, g: 0.42, d: 0.65 },
      { m: 3, g: 0.22, d: 0.50 },
      { m: 4, g: 0.12, d: 0.40 },
      { m: 5, g: 0.07, d: 0.32 },
      { m: 6, g: 0.04, d: 0.26 }
    ];
    partials.forEach(function(p){
      var o = ctx.createOscillator();
      o.type = 'sine';
      // tiny detune per partial for warmth
      o.frequency.value = f * p.m * (1 + (Math.random() - 0.5) * 0.002);
      var g = ctx.createGain();
      var peak = p.g * 0.5;
      var dec = dur * p.d;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(peak, now + 0.004);   // fast attack
      g.gain.exponentialRampToValueAtTime(0.0008, now + dec);
      o.connect(g);
      g.connect(bus);
      o.start(now);
      o.stop(now + dec + 0.05);
    });

    // "Hammer" click: very short filtered noise burst
    var clickLen = 0.045;
    var buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * clickLen), ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var n = 0; n < data.length; n++){
      var env = Math.pow(1 - n / data.length, 3);
      data[n] = (Math.random() * 2 - 1) * env * 0.5;
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = Math.min(4500, f * 6);
    bp.Q.value = 0.8;
    var cg = ctx.createGain();
    cg.gain.value = 0.18;
    src.connect(bp); bp.connect(cg); cg.connect(masterGain);
    src.start(now);
  }

  // Soft wrong-answer thud (no more harsh sawtooth)
  function playWrong(){
    if (!$('sound').checked) return;
    if (!ensureAudio()) return;
    var now = ctx.currentTime;
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, now);
    o.frequency.exponentialRampToValueAtTime(90, now + 0.18);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.16, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0008, now + 0.22);
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 700;
    o.connect(g); g.connect(lp); lp.connect(masterGain);
    o.start(now); o.stop(now + 0.25);
  }

  // ---- Practice / timing helpers ----
  function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function fmt(ms){
    if (ms == null || isNaN(ms)) return '–';
    if (ms < 1000) return Math.round(ms) + ' ms';
    return (ms/1000).toFixed(2) + ' s';
  }
  function updatePracticeHud(){
    $('pBest').textContent  = fmt(t.best);
    $('pAvg').textContent   = fmt(t.avg);
    $('pCount').textContent = t.count;
  }
  function startTimer(){
    if (!t.on) return;
    t.start = nowMs();
    $('pLive').textContent = '0 ms';
    clearInterval(t.liveId);
    t.liveId = setInterval(function(){
      var el = nowMs() - t.start;
      $('pLive').textContent = Math.round(el) + ' ms';
    }, 17);
  }
  function stopTimer(){
    if (!t.on) return null;
    clearInterval(t.liveId); t.liveId = 0;
    var elapsed = nowMs() - t.start;
    $('pLive').textContent = Math.round(elapsed) + ' ms';
    return elapsed;
  }
  function recordTime(ms){
    if (ms == null) return {isPB:false};
    t.times.push(ms);
    if (t.times.length > 200) t.times.shift();
    t.count++;
    var isPB = (t.best == null) || (ms < t.best);
    if (isPB) t.best = ms;
    var sum = 0; for (var i=0;i<t.times.length;i++) sum += t.times[i];
    t.avg = sum / t.times.length;
    saveTiming();
    updatePracticeHud();
    return {isPB:isPB};
  }

  // ---- Game logic ----
  function next(){
    var i = MIN + Math.floor(Math.random() * (MAX - MIN + 1));
    current = i; locked = false;
    drawStaff(i);
    $('msg').textContent = ''; $('msg').style.color = '';
    $('card').className = 'card';
    if (t.on) startTimer();
  }
  function stats(){
    $('score').textContent = s.score; $('streak').textContent = s.streak; $('best').textContent = s.best;
    $('acc').textContent = s.tries ? Math.round(100 * s.score / s.tries) + '%' : '–';
    save();
  }
  function flash(el, cls){ if(!el) return; el.classList.add(cls); setTimeout(function(){ el.classList.remove(cls); }, 450); }

  function correct(el){
    locked = true; s.score++; s.tries++; s.streak++; if (s.streak > s.best) s.best = s.streak;
    stats(); flash(el, 'flash-good');
    $('card').className = 'card good';

    var pbHtml = '';
    if (t.on){
      var elapsed = stopTimer();
      var res = recordTime(elapsed);
      if (res.isPB && t.count > 1) pbHtml = ' <span class="pb-badge">⚡ PB</span>';
    }

    $('msg').style.color = 'var(--good)';
    $('msg').innerHTML = '✓ ' + noteName(current) + octave(current) + '!'
      + (t.on ? ' <span style="color:var(--gold)">' + fmt(t.times[t.times.length-1]) + '</span>' : '')
      + pbHtml;
    playPiano(current, 1.6);
    setTimeout(next, t.on ? 700 : 650);
  }
  function wrong(el, silent){
    if (locked) return;
    if (!silent){ s.tries++; s.streak = 0; stats(); }
    flash(el, 'flash-bad');
    var c = $('card'); c.className = 'card'; void c.offsetWidth; c.className = 'card bad';
    $('msg').style.color = 'var(--bad)';
    $('msg').textContent = silent ? 'Only white keys here — try again' : 'Not quite — try again';
    playWrong();
  }
  function answer(i, el){
    if (locked) return;
    var ok = $('anyOctave').checked ? (i % 7 === current % 7) : (i === current);
    ok ? correct(el) : wrong(el);
  }
  function answerLetter(n, el){
    if (locked) return;
    n === noteName(current) ? correct(el) : wrong(el);
  }

  // ---- UI wiring ----
  $('modeSeg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    mode = b.dataset.mode;
    document.querySelectorAll('#modeSeg button').forEach(function(x){ x.classList.toggle('on', x === b); });
    $('piano').style.display = mode === 'piano' ? '' : 'none';
    $('letters').style.display = mode === 'buttons' ? 'flex' : 'none';
    $('octaveLabel').style.display = mode === 'piano' ? '' : 'none';
  });
  $('showNames').addEventListener('change', updateLabels);

  $('practice').addEventListener('change', function(e){
    t.on = e.target.checked;
    $('practiceHud').classList.toggle('on', t.on);
    if (t.on){
      updatePracticeHud();
      startTimer();
    } else {
      clearInterval(t.liveId); t.liveId = 0;
      $('pLive').textContent = '0 ms';
    }
  });

  $('skip').addEventListener('click', function(){ s.streak = 0; stats(); next(); });
  $('reset').addEventListener('click', function(){ s = {score:0,streak:0,best:0,tries:0}; stats(); });
  $('resetTiming').addEventListener('click', function(){
    t.times = []; t.best = null; t.avg = null; t.count = 0;
    saveTiming(); updatePracticeHud();
    if (t.on) startTimer();
  });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toUpperCase();
    if (NAMES.indexOf(k) < 0) return;
    var el = mode === 'buttons' ? document.querySelector('#letters button[data-n="'+k+'"]') : null;
    if (mode === 'piano'){
      var cands = [].slice.call(document.querySelectorAll('.wk')).filter(function(x){ return noteName(+x.dataset.i) === k; });
      el = cands.filter(function(x){ return +x.dataset.i === current; })[0] || cands[0];
    }
    answerLetter(k, el);
  });

  // Unlock audio on first user gesture (mobile browsers require this)
  document.addEventListener('pointerdown', function once(){ ensureAudio(); document.removeEventListener('pointerdown', once); }, { once:true });

  // ---- Init ----
  buildPiano(); buildLetters(); stats(); updatePracticeHud(); next();
})();
</script>
</body>
</html>
