<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Roll-Off Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f3f4f6; color: #111827; height: 100vh; display: flex; flex-direction: column; }
    
    /* Header & Admin Bar */
    header { background: #15803d; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 800; }
    select.role-sel { background: white; color: #111827; border: none; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }

    /* Main Toolbar */
    .toolbar { background: #ffffff; padding: 10px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; overflow-x: auto; }
    .btn { padding: 8px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #ffffff; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
    .btn-green { background: #15803d; color: white; border: none; }
    .btn-danger { background: #dc2626; color: white; border: none; }

    /* Filters Bar */
    .filter-bar { background: #f9fafb; padding: 8px 10px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 700; }
    .filter-bar select { padding: 4px 8px; border-radius: 6px; border: 1px solid #d1d5db; }

    /* Box List View */
    .content { flex: 1; overflow-y: auto; padding: 10px; }
    .empty-msg { text-align: center; color: #6b7280; padding: 40px 20px; font-size: 0.9rem; }

    .box-card { background: white; border-radius: 8px; border: 1px solid #e5e7eb; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .box-header { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; font-weight: 800; margin-bottom: 6px; }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
    .badge-Available { background: #e5e7eb; color: #374151; }
    .badge-Customer { background: #dcfce7; color: #15803d; }
    .badge-Pickup { background: #fef3c7; color: #d97706; }
    .badge-Exchange { background: #dbeafe; color: #2563eb; }

    .box-info { font-size: 0.82rem; color: #4b5563; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 10px; }
    .card-actions { display: flex; gap: 6px; border-top: 1px solid #f3f4f6; padding-top: 8px; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 16px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; }
    .modal h3 { font-size: 1.05rem; font-weight: 800; }
    .modal label { font-size: 0.75rem; font-weight: 700; color: #374151; margin-bottom: -6px; }
    .modal input, .modal select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.85rem; }
    .modal-btns { display: flex; gap: 8px; margin-top: 6px; }
    .modal-btns button { flex: 1; padding: 10px; }
  </style>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD9EKxFCUfV0Zv3va0l4sIvUFrA4liaJ1k",
      authDomain: "test-c8d17.firebaseapp.com",
      projectId: "test-c8d17",
      storageBucket: "test-c8d17.firebasestorage.app",
      messagingSenderId: "595934730594",
      appId: "1:595934730594:web:a3b9b24fcaff346811b43b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let boxesData = [];
    let customersData = [];
    let driversData = [];
    let currentRole = 'Driver';
    let activeEditBoxId = null;

    // Attach UI actions directly to window scope immediately
    window.openModal = function(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    };

    window.closeModal = function(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('active');
    };

    window.switchRole = function(val) { 
      currentRole = val; 
      renderApp(); 
    };

    window.saveCustomer = async function() {
      const input = document.getElementById('newCustName');
      const name = input ? input.value.trim() : '';
      if (!name) return alert('Customer name required');
      try {
        await addDoc(collection(db, "customers"), { name, createdAt: serverTimestamp() });
        window.closeModal('addCustomerModal');
        input.value = '';
      } catch (e) {
        alert("Error saving customer: " + e.message);
      }
    };

    window.saveDriver = async function() {
      const input = document.getElementById('newDriverName');
      const name = input ? input.value.trim() : '';
      if (!name) return alert('Driver name required');
      try {
        await addDoc(collection(db, "drivers"), { name, createdAt: serverTimestamp() });
        window.closeModal('addDriverModal');
        input.value = '';
      } catch (e) {
        alert("Error saving driver: " + e.message);
      }
    };

    window.saveBox = async function() {
      const boxNum = document.getElementById('newBoxNum').value.trim();
      if (!boxNum) return alert('Box number is required.');

      try {
        await addDoc(collection(db, "boxes"), {
          boxNum: boxNum,
          size: document.getElementById('newBoxSize').value,
          customer: document.getElementById('newBoxCustomer').value,
          driver: document.getElementById('newBoxDriver').value,
          address: document.getElementById('newBoxAddress').value.trim() || 'Yard',
          status: document.getElementById('newBoxStatus').value,
          notes: document.getElementById('newBoxNotes').value.trim() || 'None',
          createdAt: serverTimestamp()
        });

        window.closeModal('addBoxModal');
        document.getElementById('newBoxNum').value = '';
        document.getElementById('newBoxAddress').value = '';
        document.getElementById('newBoxNotes').value = '';
      } catch (e) {
        alert("Error saving box: " + e.message);
      }
    };

    window.openEditStatus = function(id) {
      activeEditBoxId = id;
      const box = boxesData.find(b => b.id === id);
      if (box) {
        document.getElementById('editStatusVal').value = box.status || 'Available';
        document.getElementById('editAddressVal').value = box.address || 'Yard';
        window.openModal('editStatusModal');
      }
    };

    window.commitStatusUpdate = async function() {
      if (!activeEditBoxId) return;
      const newStatus = document.getElementById('editStatusVal').value;
      const newAddress = document.getElementById('editAddressVal').value.trim() || 'Yard';

      try {
        await updateDoc(doc(db, "boxes", activeEditBoxId), {
          status: newStatus,
          address: newAddress
        });
        window.closeModal('editStatusModal');
      } catch (e) {
        alert("Error updating status: " + e.message);
      }
    };

    window.deleteBox = async function(id) {
      if (confirm('Are you sure you want to delete this box?')) {
        try {
          await deleteDoc(doc(db, "boxes", id));
        } catch (e) {
          alert("Error deleting box: " + e.message);
        }
      }
    };

    function updateDropdowns() {
      const cSel = document.getElementById('newBoxCustomer');
      if (cSel) {
        cSel.innerHTML = '<option value="Yard / Stock">Yard / Stock</option>';
        customersData.forEach(c => cSel.innerHTML += `<option value="${c.name}">${c.name}</option>`);
      }

      const dSel = document.getElementById('newBoxDriver');
      if (dSel) {
        dSel.innerHTML = '<option value="Unassigned">Unassigned</option>';
        driversData.forEach(d => dSel.innerHTML += `<option value="${d.name}">${d.name}</option>`);
      }
    }

    function renderApp() {
      const filterEl = document.getElementById('statusFilter');
      const filter = filterEl ? filterEl.value : 'ALL';
      const container = document.getElementById('contentList');
      if (!container) return;
      
      container.innerHTML = '';

      const filtered = boxesData.filter(b => filter === 'ALL' || b.status === filter);
      const countEl = document.getElementById('boxCount');
      if (countEl) countEl.innerText = `BOXES (${filtered.length})`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-msg">No boxes found.<br>Tap <b>+ Add Box</b> above to create your first container.</div>`;
        return;
      }

      filtered.forEach(b => {
        const card = document.createElement('div');
        card.className = 'box-card';
        card.innerHTML = `
          <div class="box-header">
            <span>Box ${b.boxNum || ''} (${b.size || '30'}Y)</span>
            <span class="badge badge-${b.status}">${b.status || 'Available'}</span>
          </div>
          <div class="box-info">
            <div>👤 <b>Cust:</b> ${b.customer || 'Yard'}</div>
            <div>🚚 <b>Driver:</b> ${b.driver || 'Unassigned'}</div>
            <div style="grid-column: span 2;">📍 <b>Location:</b> ${b.address || 'Yard'}</div>
            <div style="grid-column: span 2;">📝 <b>Notes:</b> ${b.notes || 'None'}</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-green" style="flex:1;" onclick="window.openEditStatus('${b.id}')">🔄 Update Status / Location</button>
            ${currentRole === 'Admin' ? `<button class="btn btn-danger" onclick="window.deleteBox('${b.id}')">🗑️ Delete</button>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function initApp() {
      // Listen to Boxes collection
      onSnapshot(query(collection(db, "boxes")), (snapshot) => {
        boxesData = [];
        snapshot.forEach((doc) => boxesData.push({ id: doc.id, ...doc.data() }));
        renderApp();
      }, (err) => console.error("Boxes sync error:", err));

      // Listen to Customers collection
      onSnapshot(query(collection(db, "customers")), (snapshot) => {
        customersData = [];
        snapshot.forEach((doc) => customersData.push({ id: doc.id, ...doc.data() }));
        updateDropdowns();
      }, (err) => console.error("Customers sync error:", err));

      // Listen to Drivers collection
      onSnapshot(query(collection(db, "drivers")), (snapshot) => {
        driversData = [];
        snapshot.forEach((doc) => driversData.push({ id: doc.id, ...doc.data() }));
        updateDropdowns();
      }, (err) => console.error("Drivers sync error:", err));
    }

    function start() {
      const filterEl = document.getElementById('statusFilter');
      if (filterEl) filterEl.addEventListener('change', renderApp);
      initApp();
    }

    // Fail-safe initialization to prevent missing DOMContentLoaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  </script>
</head>
<body>

  <header>
    <h1>🚚 ROLL-OFF TRACKER</h1>
    <select id="roleToggle" class="role-sel" onchange="window.switchRole(this.value)">
      <option value="Driver">Role: Driver</option>
      <option value="Admin">Role: Admin</option>
    </select>
  </header>

  <div class="toolbar">
    <button class="btn btn-green" onclick="window.openModal('addBoxModal')">+ Add Box</button>
    <button class="btn" onclick="window.openModal('addCustomerModal')">+ Add Customer</button>
    <button class="btn" onclick="window.openModal('addDriverModal')">+ Add Driver</button>
  </div>

  <div class="filter-bar">
    <span id="boxCount">BOXES (0)</span>
    <select id="statusFilter">
      <option value="ALL">All Statuses</option>
      <option value="Available">Available (Yard)</option>
      <option value="Customer">At Customer</option>
      <option value="Pickup">Ready for Pickup</option>
      <option value="Exchange">Ready for Exchange</option>
    </select>
  </div>

  <div id="contentList" class="content"></div>

  <!-- Add Box Modal -->
  <div id="addBoxModal" class="modal-overlay">
    <div class="modal">
      <h3>Add New Box</h3>
      <label>Box Number</label>
      <input type="text" id="newBoxNum" placeholder="e.g. 247 or B-12" />
      <label>Size</label>
      <select id="newBoxSize">
        <option value="10">10 Yard</option>
        <option value="20">20 Yard</option>
        <option value="30" selected>30 Yard</option>
        <option value="40">40 Yard</option>
      </select>
      <label>Customer</label>
      <select id="newBoxCustomer"><option value="Yard / Stock">Yard / Stock</option></select>
      <label>Driver</label>
      <select id="newBoxDriver"><option value="Unassigned">Unassigned</option></select>
      <label>Drop Address</label>
      <input type="text" id="newBoxAddress" placeholder="Address (Leave blank if in yard)" />
      <label>Initial Status</label>
      <select id="newBoxStatus">
        <option value="Available">Available (Yard)</option>
        <option value="Customer">At Customer</option>
        <option value="Pickup">Ready for Pickup</option>
        <option value="Exchange">Ready for Exchange</option>
      </select>
      <label>Notes</label>
      <input type="text" id="newBoxNotes" placeholder="Gate codes, waste type, etc." />
      <div class="modal-btns">
        <button class="btn btn-green" onclick="window.saveBox()">Save Box</button>
        <button class="btn" onclick="window.closeModal('addBoxModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Add Customer Modal -->
  <div id="addCustomerModal" class="modal-overlay">
    <div class="modal">
      <h3>Add Customer</h3>
      <label>Customer / Company Name</label>
      <input type="text" id="newCustName" placeholder="e.g. Acme Construction" />
      <div class="modal-btns">
        <button class="btn btn-green" onclick="window.saveCustomer()">Save Customer</button>
        <button class="btn" onclick="window.closeModal('addCustomerModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Add Driver Modal -->
  <div id="addDriverModal" class="modal-overlay">
    <div class="modal">
      <h3>Add Driver</h3>
      <label>Driver Name</label>
      <input type="text" id="newDriverName" placeholder="Driver Name" />
      <div class="modal-btns">
        <button class="btn btn-green" onclick="window.saveDriver()">Save Driver</button>
        <button class="btn" onclick="window.closeModal('addDriverModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Edit Status Modal -->
  <div id="editStatusModal" class="modal-overlay">
    <div class="modal">
      <h3>Update Box Status</h3>
      <label>Select New Status</label>
      <select id="editStatusVal">
        <option value="Available">Available (Yard)</option>
        <option value="Customer">At Customer</option>
        <option value="Pickup">Ready for Pickup</option>
        <option value="Exchange">Ready for Exchange</option>
      </select>
      <label>Update Location / Address</label>
      <input type="text" id="editAddressVal" placeholder="New address..." />
      <div class="modal-btns">
        <button class="btn btn-green" onclick="window.commitStatusUpdate()">Update</button>
        <button class="btn" onclick="window.closeModal('editStatusModal')">Cancel</button>
      </div>
    </div>
  </div>

</body>
</html>
