<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Note Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #1f2937;
    user-select: none;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    background: #b8dce8;
    color: #0f172a;
    text-align: center;
    font-weight: 800;
    font-size: 1rem;
    padding: 14px 12px;
    letter-spacing: 1px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .topbar:active { background: #a3cfdd; }

  /* ---------- STATS ROW ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 20px 10px 10px;
    text-align: center;
    flex-shrink: 0;
  }
  .stat-val {
    font-size: 1.8rem;
    font-weight: 500;
    color: #1f2937;
    line-height: 1.1;
  }
  .stat-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: #9ca3af;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  /* ---------- STAFF ---------- */
  .staff-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    min-height: 0;
  }
  svg.staff {
    width: 100%;
    max-width: 520px;
    height: auto;
  }

  /* ---------- KEYS ---------- */
  .keys-area {
    padding: 10px 10px 20px;
    flex-shrink: 0;
  }

  .keys-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
  }

  .key {
    background: #b8dce8;
    border: none;
    border-radius: 10px;
    color: #0f172a;
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.1s, transform 0.05s;
    padding: 0;
  }
  .key:active {
    transform: scale(0.96);
    background: #a3cfdd;
  }

  /* Sharp keys (top row) — smaller, centered over pairs */
  .key.sharp {
    width: 54px;
    height: 54px;
  }
  /* Natural keys (bottom row) — wider */
  .key.natural {
    width: 62px;
    height: 62px;
    font-size: 1.15rem;
  }

  /* Correct / wrong flashes */
  .key.correct {
    background: #22c55e !important;
    color: white !important;
  }
  .key.wrong {
    background: #ef4444 !important;
    color: white !important;
  }

  /* ---------- FEEDBACK ---------- */
  .feedback {
    text-align: center;
    font-size: 0.9rem;
    font-weight: 700;
    min-height: 22px;
    color: #9ca3af;
    margin-bottom: 8px;
    transition: color 0.15s;
  }
  .feedback.correct { color: #16a34a; }
  .feedback.wrong { color: #dc2626; }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 18px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  }
  .modal h2 { font-size: 1.4rem; font-weight: 900; margin-bottom: 10px; color: #16a34a; }
  .modal p { font-size: 0.9rem; color: #475569; line-height: 1.5; margin-bottom: 8px; }
  .modal .big { font-size: 2.4rem; margin: 12px 0; }
  .modal .btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  .modal .btn:hover { background: #15803d; }

  /* ---------- CONFETTI ---------- */
  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    pointer-events: none;
    z-index: 9999;
    animation: fall 1.6s linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  /* ---------- SMALL SCREENS ---------- */
  @media (max-width: 480px) {
    .key.sharp { width: 46px; height: 46px; font-size: 0.9rem; }
    .key.natural { width: 52px; height: 52px; font-size: 1rem; }
    .stat-val { font-size: 1.5rem; }
    .stat-label { font-size: 0.62rem; }
  }
  @media (max-width: 380px) {
    .key.sharp { width: 42px; height: 42px; font-size: 0.82rem; }
    .key.natural { width: 46px; height: 46px; font-size: 0.95rem; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar" id="topbar">ABORT</div>

  <!-- STATS -->
  <div class="stats">
    <div>
      <div class="stat-val" id="statTime">0:00</div>
      <div class="stat-label">TIME</div>
    </div>
    <div>
      <div class="stat-val" id="statCorrect">0</div>
      <div class="stat-label">CORRECT</div>
    </div>
    <div>
      <div class="stat-val" id="statAcc">0%</div>
      <div class="stat-label">ACCURACY</div>
    </div>
    <div>
      <div class="stat-val" id="statScore">0</div>
      <div class="stat-label">SCORE</div>
    </div>
  </div>

  <!-- STAFF -->
  <div class="staff-area">
    <svg class="staff" viewBox="0 0 500 300" preserveAspectRatio="xMidYMid meet">
      <!-- Staff lines -->
      <g stroke="#1f2937" stroke-width="2" stroke-linecap="round">
        <line x1="80" y1="100" x2="470" y2="100" />
        <line x1="80" y1="128" x2="470" y2="128" />
        <line x1="80" y1="156" x2="470" y2="156" />
        <line x1="80" y1="184" x2="470" y2="184" />
        <line x1="80" y1="212" x2="470" y2="212" />
      </g>

      <!-- Treble clef (unicode glyph, scaled nicely) -->
      <text x="115" y="215" font-size="180" font-family="Georgia, 'Times New Roman', serif"
            fill="#1f2937" text-anchor="middle">𝄞</text>

      <!-- Ledger lines container -->
      <g id="ledgerLines" stroke="#1f2937" stroke-width="2" stroke-linecap="round"></g>

      <!-- The note -->
      <g id="noteGroup">
        <ellipse id="noteHead" cx="300" cy="156" rx="15" ry="11"
                 fill="#1f2937" transform="rotate(-20 300 156)"/>
        <line id="noteStem" x1="315" y1="156" x2="315" y2="90"
              stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Accidental (sharp) -->
      <text id="accidental" x="272" y="168" font-size="40" font-weight="700"
            fill="#1f2937" text-anchor="middle" style="display:none;">♯</text>
    </svg>
  </div>

  <div class="feedback" id="feedback">&nbsp;</div>

  <!-- KEYS -->
  <div class="keys-area">
    <!-- Top row: sharps only (positioned with spacers to sit between naturals) -->
    <div class="keys-row" id="sharpRow">
      <!-- Filled by JS -->
    </div>
    <!-- Bottom row: naturals -->
    <div class="keys-row" id="naturalRow">
      <!-- Filled by JS -->
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nice Work!</h2>
    <p id="modalBody">You nailed 10 in a row.</p>
    <div class="big" id="modalBig">🔥</div>
    <p id="modalSub" style="font-size:0.8rem; color:#94a3b8;"></p>
    <button class="btn" id="modalBtn">Keep Going</button>
  </div>
</div>

<script>
/* ============================================================
   NOTE DEFINITIONS
   Steps: 0 = E4 (bottom line), 1 = F4, ... 8 = F5
   Middle C (C4) is step -2 with a ledger line below the staff.
   Each staff line/space = 1 step = 28/2 = 14px on the viewBox.
   ============================================================ */

// Map a step to a y-coordinate on the staff
// Bottom line (E4) = y 212; each diatonic step = 14 units
function yForStep(step) {
  return 212 - step * 14;
}

// All natural notes C4..C5 plus we'll add sharps
const NATURAL_NOTES = [
  { name: "C", octave: 4, step: -2, accidental: null },
  { name: "D", octave: 4, step: -1, accidental: null },
  { name: "E", octave: 4, step: 0,  accidental: null },
  { name: "F", octave: 4, step: 1,  accidental: null },
  { name: "G", octave: 4, step: 2,  accidental: null },
  { name: "A", octave: 4, step: 3,  accidental: null },
  { name: "B", octave: 4, step: 4,  accidental: null },
  { name: "C", octave: 5, step: 5,  accidental: null },
  { name: "D", octave: 5, step: 6,  accidental: null },
  { name: "E", octave: 5, step: 7,  accidental: null },
  { name: "F", octave: 5, step: 8,  accidental: null },
];

// Sharps sit on the same step as their lower natural, with an accidental
const SHARP_NOTES = [
  { name: "C", octave: 4, step: -2, accidental: "sharp" }, // C#4
  { name: "D", octave: 4, step: -1, accidental: "sharp" }, // D#4
  { name: "F", octave: 4, step: 1,  accidental: "sharp" }, // F#4
  { name: "G", octave: 4, step: 2,  accidental: "sharp" }, // G#4
  { name: "A", octave: 4, step: 3,  accidental: "sharp" }, // A#4
];

const ALL_NOTES = [...NATURAL_NOTES, ...SHARP_NOTES];

/* ============================================================
   STATE
   ============================================================ */
let currentNote = null;
let correct = 0;
let attempts = 0;
let score = 0;
let streak = 0;
let bestStreak = 0;
let locked = false;
let startTime = Date.now();
let timerHandle = null;

/* ============================================================
   DOM
   ============================================================ */
const $ = id => document.getElementById(id);
const noteHead = $("noteHead");
const noteStem = $("noteStem");
const ledgerLines = $("ledgerLines");
const accidentalEl = $("accidental");
const feedbackEl = $("feedback");

/* ============================================================
   BUILD KEY ROWS
   Bottom row: C D E F G A B
   Top row: C# D#    F# G# A#
   (The gap after D# is intentional, matching a real piano layout.)
   ============================================================ */
function buildKeys() {
  const naturalRow = $("naturalRow");
  const sharpRow = $("sharpRow");

  const naturals = ["C", "D", "E", "F", "G", "A", "B"];
  const sharps = ["C#", "D#", "—", "F#", "G#", "A#"]; // "—" is a spacer

  // Natural keys
  naturals.forEach(n => {
    const btn = document.createElement("button");
    btn.className = "key natural";
    btn.textContent = n;
    btn.dataset.note = n;
    btn.dataset.type = "natural";
    btn.addEventListener("click", () => onKeyPress(n, "natural"));
    naturalRow.appendChild(btn);
  });

  // Sharp keys with a spacer
  sharps.forEach(s => {
    if (s === "—") {
      const spacer = document.createElement("div");
      spacer.style.width = "62px";
      spacer.style.height = "54px";
      spacer.style.visibility = "hidden";
      sharpRow.appendChild(spacer);
      return;
    }
    const btn = document.createElement("button");
    btn.className = "key sharp";
    btn.textContent = s;
    btn.dataset.note = s.replace("#", "");
    btn.dataset.type = "sharp";
    btn.addEventListener("click", () => onKeyPress(s.replace("#", ""), "sharp"));
    sharpRow.appendChild(btn);
  });
}

/* ============================================================
   RENDER NOTE ON STAFF
   ============================================================ */
function renderNote(note) {
  const y = yForStep(note.step);
  const cx = 300;

  // Note head
  noteHead.setAttribute("cx", cx);
  noteHead.setAttribute("cy", y);
  noteHead.setAttribute("transform", `rotate(-20 ${cx} ${y})`);

  // Stem direction: up if note is on/below middle line (y >= 156)
  const stemUp = y >= 156;
  const stemX = stemUp ? cx + 15 : cx - 15;
  const stemY1 = y;
  const stemY2 = stemUp ? y - 70 : y + 70;
  noteStem.setAttribute("x1", stemX);
  noteStem.setAttribute("y1", stemY1);
  noteStem.setAttribute("x2", stemX);
  noteStem.setAttribute("y2", stemY2);

  // Ledger lines
  ledgerLines.innerHTML = "";
  const addLedger = (lineY) => {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
    l.setAttribute("x1", cx - 26);
    l.setAttribute("y1", lineY);
    l.setAttribute("x2", cx + 26);
    l.setAttribute("y2", lineY);
    ledgerLines.appendChild(l);
  };
  // Middle C (step -2) sits below the staff on its own ledger line
  if (note.step === -2) addLedger(240);
  // A5 (step 10) above the staff would need one, but we stop at F5 so skip

  // Accidental
  if (note.accidental === "sharp") {
    accidentalEl.style.display = "block";
    accidentalEl.textContent = "♯";
    accidentalEl.setAttribute("x", cx - 38);
    accidentalEl.setAttribute("y", y + 14);
  } else {
    accidentalEl.style.display = "none";
  }
}

/* ============================================================
   GAME LOGIC
   ============================================================ */
function pickNote() {
  let note;
  do {
    note = ALL_NOTES[Math.floor(Math.random() * ALL_NOTES.length)];
  } while (ALL_NOTES.length > 1 && currentNote &&
           note.name === currentNote.name &&
           note.octave === currentNote.octave &&
           note.accidental === currentNote.accidental);
  return note;
}

function newRound() {
  currentNote = pickNote();
  locked = false;
  renderNote(currentNote);
  feedbackEl.textContent = "\u00a0";
  feedbackEl.className = "feedback";
  clearHighlights();
}

function clearHighlights() {
  document.querySelectorAll(".key").forEach(k => {
    k.classList.remove("correct", "wrong");
  });
}

function onKeyPress(name, type) {
  if (locked || !currentNote) return;

  // The correct answer is: same letter name, and accidental type must match
  const targetIsSharp = currentNote.accidental === "sharp";
  const pressedIsSharp = type === "sharp";

  const isCorrect = (name === currentNote.name) && (targetIsSharp === pressedIsSharp);

  attempts++;

  // Find the pressed button for visual feedback
  const btn = document.querySelector(
    `.key[data-note="${name}"][data-type="${type}"]`
  );

  if (isCorrect) {
    locked = true;
    correct++;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    score += 10 + (streak >= 3 ? 5 : 0);
    if (btn) btn.classList.add("correct");
    feedbackEl.textContent = `Correct!`;
    feedbackEl.className = "feedback correct";
    playTone(currentNote);
    celebrate();
    updateStats();
    setTimeout(() => newRound(), 700);
  } else {
    streak = 0;
    score = Math.max(0, score - 3);
    if (btn) btn.classList.add("wrong");
    feedbackEl.textContent = `Try again`;
    feedbackEl.className = "feedback wrong";
    updateStats();
    setTimeout(() => { if (btn) btn.classList.remove("wrong"); }, 400);
  }
}

/* ============================================================
   STATS
   ============================================================ */
function updateStats() {
  const acc = attempts === 0 ? 0 : Math.round((correct / attempts) * 100);
  $("statCorrect").textContent = correct;
  $("statAcc").textContent = acc + "%";
  $("statScore").textContent = score;
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ":" + String(r).padStart(2, "0");
}

function startTimer() {
  startTime = Date.now();
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    $("statTime").textContent = formatTime(Date.now() - startTime);
  }, 250);
}

/* ============================================================
   SOUND
   ============================================================ */
let audioCtx = null;
function playTone(note) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const semitoneMap = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    const semitone = semitoneMap[note.name] + (note.accidental === "sharp" ? 1 : 0);
    const midi = 12 * (note.octave + 1) + semitone;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  } catch (e) {}
}

/* ============================================================
   CELEBRATION
   ============================================================ */
function celebrate() {
  const colors = ["#22c55e", "#fbbf24", "#3b82f6", "#ef4444", "#a855f7"];
  for (let i = 0; i < 15; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = (Math.random() * 0.25) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }

  if (streak === 5 || streak === 10 || streak === 20) {
    showModal(
      streak === 5 ? "Nice Start! 🔥" :
      streak === 10 ? "On Fire! 🚀" : "Legendary! 🏆",
      `You got ${streak} correct in a row!`,
      streak === 5 ? "5️⃣" : streak === 10 ? "🔟" : "💯",
      "Keep the streak alive!"
    );
  }
}

/* ============================================================
   MODAL
   ============================================================ */
function showModal(title, body, big, sub) {
  $("modalTitle").textContent = title;
  $("modalBody").textContent = body;
  $("modalBig").textContent = big;
  $("modalSub").textContent = sub || "";
  $("modalOverlay").classList.add("show");
}
$("modalBtn").addEventListener("click", () => {
  $("modalOverlay").classList.remove("show");
});

/* ============================================================
   ABORT
   ============================================================ */
$("topbar").addEventListener("click", () => {
  if (!confirm("Abort this session? Your progress will be lost.")) return;
  correct = 0; attempts = 0; score = 0; streak = 0; bestStreak = 0;
  updateStats();
  startTimer();
  newRound();
});

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
const KEY_MAP = {
  "a": { name: "C", type: "natural" },
  "w": { name: "C", type: "sharp" },
  "s": { name: "D", type: "natural" },
  "e": { name: "D", type: "sharp" },
  "d": { name: "E", type: "natural" },
  "f": { name: "F", type: "natural" },
  "t": { name: "F", type: "sharp" },
  "g": { name: "G", type: "natural" },
  "y": { name: "G", type: "sharp" },
  "h": { name: "A", type: "natural" },
  "u": { name: "A", type: "sharp" },
  "j": { name: "B", type: "natural" },
  "k": { name: "C", type: "sharp" }, // not used since we don't have C#5; kept for safety
};

document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  const k = KEY_MAP[e.key.toLowerCase()];
  if (!k) return;
  const btn = document.querySelector(`.key[data-note="${k.name}"][data-type="${k.type}"]`);
  if (btn) {
    btn.style.transform = "scale(0.96)";
    setTimeout(() => btn.style.transform = "", 80);
  }
  onKeyPress(k.name, k.type);
});

/* ============================================================
   INIT
   ============================================================ */
buildKeys();
newRound();
updateStats();
startTimer();
</script>
</body>
</html>
